tool: get_country
cases:
  - {"name": "by name, with neighbour names resolved", "args": {"country": "Canada"}, "secrets": {"RESTCOUNTRIES_API_KEY": "stub"}, "http": [{"method": "GET", "url": "https://api.restcountries.com/countries/v5/name?q=Canada&limit=10&response_fields=names.common%2Cnames.official%2Ccodes.alpha_2%2Ccodes.alpha_3%2Ccapitals%2Cregion%2Csubregion%2Ccontinents%2Cpopulation%2Carea%2Clanguages%2Ccurrencies%2Cborders%2Clandlocked%2Cflag.emoji", "status": 200, "headers": {"content-type": "application/json"}, "body": {"data": {"objects": [{"names": {"common": "Canada", "official": "Canada"}, "codes": {"alpha_2": "CA", "alpha_3": "CAN"}, "capitals": [{"attributes": {"administrative": false, "constitutional": false, "executive": false, "judicial": false, "legislative": false, "primary": true}, "coordinates": {"lat": 45.42, "lng": -75.7}, "name": "Ottawa"}], "region": "Americas", "subregion": "North America", "continents": ["North America"], "population": 41798407, "area": {"kilometers": 9984670, "miles": 3855101.1}, "languages": [{"bcp47": "en", "iso639_1": "en", "iso639_2b": "eng", "iso639_2t": "eng", "iso639_3": "eng", "name": "English", "native_name": "English"}, {"bcp47": "fr", "iso639_1": "fr", "iso639_2b": "fre", "iso639_2t": "fra", "iso639_3": "fra", "name": "French", "native_name": "français"}], "currencies": [{"code": "CAD", "name": "Canadian dollar", "symbol": "$"}], "borders": ["USA"], "landlocked": false, "flag": {"emoji": "🇨🇦"}}], "meta": {"total": 1, "count": 1, "limit": 10, "offset": 0, "more": false}}}}, {"method": "GET", "url": "https://api.restcountries.com/countries/v5/borders/CAN?response_fields=names.common%2Ccodes.alpha_3&limit=100", "status": 200, "headers": {"content-type": "application/json"}, "body": {"data": {"objects": [{"names": {"common": "United States"}, "codes": {"alpha_3": "USA"}}], "meta": {"total": 1, "count": 1, "limit": 100, "offset": 0, "more": false}}}}], "expect": {"ok": true, "output_schema": {"type": "object", "required": ["name", "capitals", "population", "area_km2", "density_per_km2", "languages", "currencies", "region", "subregion", "neighbours"], "properties": {"name": {"const": "Canada"}, "capitals": {"const": ["Ottawa"]}, "population": {"const": 41798407}, "area_km2": {"const": 9984670}, "languages": {"const": ["English", "French"]}, "region": {"const": "Americas"}, "currencies": {"const": [{"code": "CAD", "name": "Canadian dollar", "symbol": "$"}]}, "neighbours": {"const": [{"code": "USA", "name": "United States"}]}, "error": false}}}}
