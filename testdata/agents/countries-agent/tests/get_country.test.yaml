es": {"alpha_3": "MLI"}}], "meta": {"total": 5, "count": 5, "limit": 100, "offset": 0, "more": false}}}}], "expect": {"ok": true, "output_schema": {"type": "object", "required": ["name", "neighbours"], "properties": {"name": {"const": "Ivory Coast"}, "capitals": {"const": ["Yamoussoukro"]}, "neighbours": {"type": "array", "minItems": 5, "maxItems": 5, "items": {"type": "object", "required": ["code", "name"], "not": {"properties": {"name": {"pattern": "^[A-Z]{3}$"}}}}}}}}}
