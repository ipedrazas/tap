version: "3"

vars:
  REGISTRY: registry.hiddenfield.dev
  TAP_NS: tap-system
  SESSIONS_BUCKET:
    sh: awk '/^sessions:/{f=1} f && $1=="bucket:"{print $2; exit}' platform.yaml
  # Bundle attestations (tapctl attest); must match platform.yaml signing.predicateType.
  PREDICATE_TYPE: https://tap.hiddenfield.dev/attestations/bundle/v1
  # Agent sources: the agents repo (ipedrazas/tap-agents) checked out next
  # to this one. Its Taskfile passes its own path when it forwards a task.
  AGENTS_DIR: '{{.AGENTS_DIR | default "../tap-agents/agents"}}'
  # Build metadata stamped into every binary (see pkg/version).
  GIT_COMMIT:
    sh: git rev-parse HEAD
  GIT_DIRTY:
    sh: git diff --quiet HEAD -- cmd pkg images go.mod go.sum schema && echo "" || echo "-dirty"
  BUILD_DATE:
    sh: date -u +%Y-%m-%dT%H:%M:%SZ
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  LDFLAGS: -X github.com/ipedrazas/tap/pkg/version.Version={{.VERSION}} -X github.com/ipedrazas/tap/pkg/version.Commit={{.GIT_COMMIT}}{{.GIT_DIRTY}} -X github.com/ipedrazas/tap/pkg/version.Date={{.BUILD_DATE}}

# cosign signs through OpenBao Transit (hashivault://tap-build, tap-tested);
# VAULT_TOKEN comes from deploy/openbao/token.sh in the commands that sign.
env:
  VAULT_ADDR:
    sh: awk '/^secrets:/{f=1} f && $1=="server:"{print $2; exit}' platform.yaml
  TRANSIT_SECRET_ENGINE_PATH: tap-transit

tasks:
  tools:
    desc: Install CLI tools used by the pipeline (oras, crane, cosign)
    cmds:
      - go install oras.land/oras/cmd/oras@v1.3.0
      - go install github.com/google/go-containerregistry/cmd/crane@v0.20.6
      - go install github.com/sigstore/cosign/v2/cmd/cosign@v2.5.3
    status:
      - command -v oras
      - command -v crane
      - command -v cosign

  platform:up:
    desc: Apply tap-system (gateway, certificate, registry, landing, OIDC, egress proxy)
    deps: [registry:creds, auth:client]
    cmds:
      # Legacy egress keys and policies: the factory's key, and agents not yet
      # redeployed since phase 1 (which use OpenBao and egress-policy-<agent>).
      # Created empty once, never overwritten.
      - kubectl -n {{.TAP_NS}} get secret egress-keys >/dev/null 2>&1 || kubectl -n {{.TAP_NS}} create secret generic egress-keys
      - kubectl -n {{.TAP_NS}} get configmap egress-policy >/dev/null 2>&1 || kubectl -n {{.TAP_NS}} create configmap egress-policy
      # Console display titles and hook settings; written by the console only.
      - kubectl -n {{.TAP_NS}} get configmap agent-settings >/dev/null 2>&1 || kubectl -n {{.TAP_NS}} create configmap agent-settings
      # Hook credentials; patched by the console, read by tap-hooks.
      - kubectl -n {{.TAP_NS}} get secret agent-hooks >/dev/null 2>&1 || kubectl -n {{.TAP_NS}} create secret generic agent-hooks
      # tap-hooks -> agent trigger port; pushed to OpenBao (deploy/platform/openbao-platform.yaml), read by every agent.
      - kubectl -n {{.TAP_NS}} get secret hooks-trigger-token >/dev/null 2>&1 || kubectl -n {{.TAP_NS}} create secret generic hooks-trigger-token --from-literal=token="$(openssl rand -hex 32)"
      - task: console:config
      - kubectl apply -k deploy/platform
      - kubectl -n {{.TAP_NS}} wait certificate/tap --for=condition=Ready --timeout=300s
      - kubectl -n {{.TAP_NS}} rollout status deploy/zot --timeout=180s

  console:config:
    desc: Publish platform.yaml (teams, OpenBao) to the console as ConfigMap tap-platform; rerun after editing teams
    cmds:
      - kubectl -n {{.TAP_NS}} create configmap tap-platform --from-file=platform.yaml --dry-run=client -o yaml | kubectl apply -f - >/dev/null

  platform:status:
    desc: Show the state of tap-system
    cmds:
      - kubectl -n {{.TAP_NS}} get gateway,httproute,certificate,securitypolicy,pods,svc

  platform:ns:
    run: once
    internal: true
    cmds:
      - kubectl apply -f deploy/platform/namespace.yaml

  registry:creds:
    desc: Create the zot push users (htpasswd) tap and tap-ci; passwords in .tap/registry.pass and .tap/registry-ci.pass (tap-ci's also goes to OpenBao with ci:onboard)
    deps: [platform:ns]
    cmds:
      - mkdir -p .tap
      - test -f .tap/registry.pass || openssl rand -hex 24 > .tap/registry.pass
      - test -f .tap/registry-ci.pass || openssl rand -hex 24 > .tap/registry-ci.pass
      - |
        { htpasswd -nbB tap "$(cat .tap/registry.pass)"; htpasswd -nbB tap-ci "$(cat .tap/registry-ci.pass)"; } | grep . > .tap/htpasswd
        kubectl -n {{.TAP_NS}} create secret generic zot-htpasswd --from-file=htpasswd=.tap/htpasswd \
          --dry-run=client -o yaml | kubectl apply -f -
    status:
      - kubectl -n {{.TAP_NS}} get secret zot-htpasswd -o jsonpath='{.data.htpasswd}' | base64 -d | grep -q '^tap-ci:'

  registry:login:
    desc: Log oras, crane and docker into the registry as the push user
    run: once
    cmds:
      - |
        # zot allows anonymous reads, so oras login "succeeds" with any
        # password; a wrong one only fails with 401 when credentials are sent.
        test -s .tap/registry.pass || { echo "no .tap/registry.pass; run: task registry:creds --force, then restart zot" >&2; exit 1; }
        code=$(curl -s -o /dev/null -w '%{http_code}' -u "tap:$(cat .tap/registry.pass)" https://{{.REGISTRY}}/v2/)
        [ "$code" = 200 ] || { echo "registry rejected .tap/registry.pass ($code); regenerate: rm .tap/registry.pass && task registry:creds --force, then restart zot" >&2; exit 1; }
      - oras login {{.REGISTRY}} -u tap --password-stdin < .tap/registry.pass
      - crane auth login {{.REGISTRY}} -u tap -p "$(cat .tap/registry.pass)"
      - docker login {{.REGISTRY}} -u tap --password-stdin < .tap/registry.pass

  auth:client:
    desc: Create the OIDC client secret for the tap Dex client
    deps: [platform:ns]
    cmds:
      - mkdir -p .tap
      - test -f .tap/oidc-client.secret || openssl rand -hex 24 > .tap/oidc-client.secret
      - |
        kubectl -n {{.TAP_NS}} create secret generic oidc-client \
          --from-literal=client-secret="$(cat .tap/oidc-client.secret)" \
          --dry-run=client -o yaml | kubectl apply -f -
    status:
      - kubectl -n {{.TAP_NS}} get secret oidc-client

  auth:dex:
    desc: Register the tap OIDC client in Dex (kodo-auth). Edits kodo's Dex; mirror it in kodo/deploy/k3s/dex.yaml
    deps: [auth:client]
    cmds:
      - kubectl -n kodo-auth get cm dex -o yaml > .tap/dex-cm.backup.yaml
      - kubectl -n kodo-auth patch secret dex-secrets --type merge -p "{\"stringData\":{\"TAP_CLIENT_SECRET\":\"$(cat .tap/oidc-client.secret)\"}}"
      - kubectl -n kodo-auth get cm dex -o jsonpath='{.data.config\.yaml}' > .tap/dex-config.yaml
      - |
        python3 - <<'PY'
        p = ".tap/dex-config.yaml"
        s = open(p).read()
        if "id: tap\n" not in s:
            s = s.replace("staticPasswords:", "  - id: tap\n    name: tap\n    secretEnv: TAP_CLIENT_SECRET\n    redirectURIs:\n      - https://tap.hiddenfield.dev/oauth2/callback\nstaticPasswords:", 1)
        open(p, "w").write(s)
        PY
      - kubectl -n kodo-auth create cm dex --from-file=config.yaml=.tap/dex-config.yaml --dry-run=client -o yaml | kubectl apply -f -
      - kubectl -n kodo-auth rollout restart deploy/dex
      - kubectl -n kodo-auth rollout status deploy/dex --timeout=120s

  model:client:
    desc: Register a tap API key with the kodo-inference AI gateway. Edits kodo's kodo-inference-clients secret
    deps: [platform:ns]
    cmds:
      - mkdir -p .tap
      - test -f .tap/model-client.key || openssl rand -hex 32 > .tap/model-client.key
      - kubectl -n kodo-inference patch secret kodo-inference-clients --type merge -p "{\"stringData\":{\"tap\":\"$(cat .tap/model-client.key)\"}}"
      - |
        kubectl -n {{.TAP_NS}} create secret generic model-credentials --from-file=api-key=.tap/model-client.key \
          --dry-run=client -o yaml | kubectl apply -f -
      - kubectl apply -f deploy/platform/model-access/networkpolicy.yaml

  # ---- images ---------------------------------------------------------------

  images:push:
    desc: Build and push harness and runner images (linux/amd64, OCI), then pin their digests in platform.yaml
    deps: [registry:login, tapctl]
    vars:
      IMAGES: '{{.IMAGES | default "harness runner-node runner-python runner-base egress-proxy casa-collector console hooks factory factory-publisher"}}'
      TAG:
        sh: echo "$(git rev-parse --short HEAD)$(git diff --quiet HEAD -- cmd pkg images casa-collector go.mod go.sum || echo -dirty)"
    cmds:
      - for: { var: IMAGES }
        task: image:push
        vars: { IMAGE: "{{.ITEM}}", TAG: "{{.TAG}}" }
      - git diff --stat platform.yaml

  image:push:
    internal: true
    requires: { vars: [IMAGE, TAG] }
    vars:
      REF: "{{.REGISTRY}}/tap/{{.IMAGE}}:{{.TAG}}"
      # casa-collector is its own module (bound for its own repository) and
      # builds from its own directory.
      CONTEXT: '{{if eq .IMAGE "casa-collector"}}casa-collector{{else}}.{{end}}'
      DOCKERFILE: '{{if eq .IMAGE "casa-collector"}}casa-collector/Dockerfile{{else}}images/{{.IMAGE}}/Dockerfile{{end}}'
    cmds:
      - |
        docker buildx build --platform linux/amd64 --provenance=false --sbom=false \
          -f {{.DOCKERFILE}} \
          --build-arg VERSION={{.VERSION}} --build-arg COMMIT={{.GIT_COMMIT}}{{.GIT_DIRTY}} --build-arg DATE={{.BUILD_DATE}} \
          --output type=image,name={{.REF}},push=true,oci-mediatypes=true {{.CONTEXT}}
      - task: sign
        vars: { REF: '{{.REGISTRY}}/tap/{{.IMAGE}}@$(crane digest {{.REF}})' }
      - |
        case "{{.IMAGE}}" in console|hooks|factory|factory-publisher) ;; *) bin/tapctl platform pin {{.IMAGE}} "{{.REGISTRY}}/tap/{{.IMAGE}}@$(crane digest {{.REF}})" ;; esac
      - |
        # Platform services are pinned in their manifests rather than platform.yaml.
        for manifest in $(grep -lE "image: {{.REGISTRY}}/tap/{{.IMAGE}}@" deploy/platform/*.yaml deploy/factory/*.yaml); do
          sed -i.bak -E "s#(image: {{.REGISTRY}}/tap/{{.IMAGE}})@sha256:[a-f0-9]{64}#\1@$(crane digest {{.REF}})#" "$manifest"
          rm -f "$manifest.bak"
        done

  images:sign:
    desc: Sign every curated image pinned in platform.yaml and deploy/platform (idempotent)
    deps: [registry:login]
    cmds:
      - for:
          var: REFS
        task: sign
        vars: { REF: "{{.ITEM}}" }
    vars:
      REFS:
        sh: grep -hoE '{{.REGISTRY}}/tap/[a-z0-9-]+@sha256:[a-f0-9]{64}' platform.yaml deploy/platform/*.yaml deploy/factory/*.yaml | grep -v '@sha256:0\{64\}' | sort -u | tr '\n' ' '

  # ---- signing and admission -------------------------------------------------

  signing:key:
    desc: Print the public halves of the Transit signing keys (created by openbao:onboard; the private halves never leave OpenBao)
    cmds:
      - |
        VAULT_TOKEN=$(deploy/openbao/token.sh) || exit 1; export VAULT_TOKEN
        for k in tap-build tap-tested; do echo "# $k"; cosign public-key --key hashivault://$k; done

  signing:pin:
    desc: Write the Transit keys' public halves into platform.yaml signing.* (after onboarding new keys), then run admission:apply and images:sign
    deps: [tapctl]
    cmds:
      - |
        VAULT_TOKEN=$(deploy/openbao/token.sh) || exit 1; export VAULT_TOKEN
        cosign public-key --key hashivault://tap-build | bin/tapctl signing pin build
        cosign public-key --key hashivault://tap-tested | bin/tapctl signing pin tested
      - git diff --stat platform.yaml

  # Public keys admission trusts, from platform.yaml; derived, so a lost .tap
  # costs nothing.
  signing:pubs:
    internal: true
    silent: true
    run: once
    deps: [tapctl]
    cmds:
      - mkdir -p .tap
      - bin/tapctl signing key build > .tap/cosign.pub
      - bin/tapctl signing key tested > .tap/cosign-tested.pub

  signing:check:
    internal: true
    silent: true
    run: once
    deps: [signing:pubs]
    cmds:
      - |
        VAULT_TOKEN=$(deploy/openbao/token.sh) || exit 1; export VAULT_TOKEN
        # The operator token is periodic: renewing it on every use keeps it alive.
        curl -sf -o /dev/null -X POST -H "X-Vault-Token: $VAULT_TOKEN" "$VAULT_ADDR/v1/auth/token/renew-self" \
          || { echo "OpenBao rejected the operator token; run: task openbao:onboard" >&2; exit 1; }
        # The key we sign with must be the one admission trusts.
        for pair in tap-build:cosign tap-tested:cosign-tested; do
          key=${pair%%:*}; pub=${pair#*:}
          [ "$(cosign public-key --key hashivault://$key 2>/dev/null | tr -d ' \n')" = "$(tr -d ' \n' < .tap/$pub.pub)" ] \
            || { echo "Transit key $key is not platform.yaml's signing key; run: task signing:pin" >&2; exit 1; }
        done

  sign:
    internal: true
    silent: true
    requires: { vars: [REF] }
    deps: [signing:check]
    cmds:
      - |
        # Skip when already signed: ECDSA signatures differ each time, so re-signing would pile up.
        if cosign verify --key .tap/cosign.pub --insecure-ignore-tlog=true "{{.REF}}" >/dev/null 2>&1; then
          echo "signed: {{.REF}}"
        else
          VAULT_TOKEN="$(deploy/openbao/token.sh)" cosign sign --key hashivault://tap-build --tlog-upload=false --yes "{{.REF}}" 2>&1 | grep -v '^WARNING' || true
          cosign verify --key .tap/cosign.pub --insecure-ignore-tlog=true "{{.REF}}" >/dev/null 2>&1 \
            || { echo "signing failed: {{.REF}}" >&2; exit 1; }
          echo "signed: {{.REF}}"
        fi

  admission:install:
    desc: Install Kyverno (chart 3.9.1) with webhooks limited to tap-labelled namespaces
    cmds:
      - helm repo add kyverno https://kyverno.github.io/kyverno/ >/dev/null 2>&1 || true
      - helm repo update  >/dev/null 2>&1 || true
      - helm upgrade --install kyverno kyverno/kyverno --version 3.9.1 -n kyverno --create-namespace -f deploy/kyverno/values.yaml --wait --timeout 5m

  admission:apply:
    desc: Apply the signature/attestation policies in platform.yaml's mode (signing.admission audit|enforce)
    deps: [tapctl]
    cmds:
      # Namespaces rendered before phase 7 lack the label Kyverno's webhooks select on.
      - kubectl label ns -l tap.hiddenfield.dev/agent tap.hiddenfield.dev/admission=verify --overwrite >/dev/null
      - kubectl get ns {{.TEST_NS}} >/dev/null 2>&1 && kubectl label ns {{.TEST_NS}} tap.hiddenfield.dev/admission=verify --overwrite >/dev/null || true
      - bin/tapctl admission policy | kubectl apply -f -
    vars:
      TEST_NS: tap-ci

  admission:status:
    desc: Show the policies and their results per agent namespace (audit mode findings)
    cmds:
      - kubectl get imagevalidatingpolicies
      - kubectl get policyreports -A -l app.kubernetes.io/managed-by=kyverno -o custom-columns='NAMESPACE:.metadata.namespace,KIND:.scope.kind,NAME:.scope.name,PASS:.summary.pass,FAIL:.summary.fail,ERROR:.summary.error'

  # ---- secrets (OpenBao + External Secrets) ---------------------------------

  secrets:install:
    desc: Install External Secrets Operator (chart 2.11.0); agent namespaces sync secrets from OpenBao through it
    cmds:
      - helm repo add external-secrets https://charts.external-secrets.io >/dev/null 2>&1 || true
      - helm repo update external-secrets >/dev/null 2>&1 || true
      - helm upgrade --install external-secrets external-secrets/external-secrets --version 2.11.0 -n external-secrets --create-namespace -f deploy/external-secrets/values.yaml --wait --timeout 5m

  openbao:onboard:
    silent: true
    desc: "Set up tap in OpenBao (KV, Kubernetes auth, Transit signing keys, policies) and store an operator token in the Keychain. Needs an admin token: read -s BAO_TOKEN; export BAO_TOKEN"
    cmds:
      - kubectl -n {{.TAP_NS}} apply -f deploy/platform/openbao-reviewer.yaml
      - |
        for i in $(seq 1 30); do
          kubectl -n {{.TAP_NS}} get secret openbao-reviewer-token -o jsonpath='{.data.token}' | grep -q . && break
          sleep 1
        done
      - |
        [ -n "${BAO_TOKEN:-}" ] || { echo "set BAO_TOKEN to an OpenBao admin token (read -s BAO_TOKEN; export BAO_TOKEN)" >&2; exit 1; }
        host=$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')
        # The operator token goes to the Keychain, never into the repo.
        printf '%s\n' "$BAO_TOKEN" | deploy/openbao/run.sh deploy/openbao/onboard-tap.sh --reviewer K8S_HOST="$host" \
          | deploy/openbao/token.sh --store || { echo "onboarding failed" >&2; exit 1; }

  flux:install:
    desc: Install Flux (deploy/flux) and let it apply the agents from the signed manifests artifact that tap-agents CI publishes
    deps: [tapctl]
    cmds:
      # Server-side: the CRDs are too large for the last-applied annotation.
      - kubectl apply --server-side -f deploy/flux/flux.yaml
      - kubectl -n flux-system rollout status deploy/source-controller deploy/kustomize-controller deploy/notification-controller --timeout=180s
      # The key the artifact must be signed with: platform.yaml signing.publicKey.
      - bin/tapctl signing key build | kubectl -n flux-system create secret generic tap-build-pub --from-file=cosign.pub=/dev/stdin --dry-run=client -o yaml | kubectl apply -f -
      - kubectl apply -f deploy/ci/rbac.yaml
      - kubectl apply -f deploy/flux/agents.yaml
      - kubectl -n flux-system wait ocirepository/agents --for=condition=Ready --timeout=120s
      - kubectl -n flux-system wait kustomization/agents --for=condition=Ready --timeout=360s
      - task: flux:status

  flux:status:
    desc: What Flux last fetched and applied for the agents
    cmds:
      - kubectl -n flux-system get ocirepository/agents kustomization/agents
      - |
        echo "applied: $(kubectl -n flux-system get kustomization agents -o jsonpath='{.status.lastAppliedOriginRevision} ({.status.lastAppliedRevision})')"

  ci:onboard:
    silent: true
    desc: "Let CI in the agents repo sign, push and run fixtures with no stored credentials (OpenBao JWT auth for GitHub OIDC, Kubernetes token minting, zot CI user). Needs an admin token: read -s BAO_TOKEN; export BAO_TOKEN"
    vars:
      GH_REPO: '{{.GH_REPO | default "ipedrazas/tap-agents"}}'
      WORKFLOW: '{{.WORKFLOW | default "publish.yml"}}'
    cmds:
      - task: registry:creds
      - kubectl apply -f deploy/ci/rbac.yaml
      - |
        for i in $(seq 1 30); do
          kubectl -n {{.TAP_NS}} get secret openbao-ci-issuer-token -o jsonpath='{.data.token}' | grep -q . && break
          sleep 1
        done
      - |
        [ -n "${BAO_TOKEN:-}" ] || { echo "set BAO_TOKEN to an OpenBao admin token (read -s BAO_TOKEN; export BAO_TOKEN)" >&2; exit 1; }
        host=$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')
        { printf '%s\n' "$BAO_TOKEN"; cat .tap/registry-ci.pass; } \
          | deploy/openbao/run.sh deploy/openbao/onboard-ci.sh --ci K8S_HOST="$host" GH_REPO={{.GH_REPO}} WORKFLOW={{.WORKFLOW}}
      # zot reads htpasswd and its config at start.
      - kubectl apply -k deploy/platform >/dev/null && kubectl -n {{.TAP_NS}} rollout restart deploy/zot && kubectl -n {{.TAP_NS}} rollout status deploy/zot --timeout=180s

  secrets:put:
    desc: "Store one agent secret in OpenBao from stdin: pbpaste | task secrets:put AGENT=foo NAME=API_KEY"
    deps: [tapctl]
    requires: { vars: [AGENT, NAME] }
    cmds:
      - |
        token=$(deploy/openbao/token.sh) || exit 1
        line=$(bin/tapctl secrets --paths {{.AGENTS_DIR}}/{{.AGENT}} | awk '$1 == "{{.NAME}}" {print $2, $3}')
        [ -n "$line" ] || { echo "{{.AGENTS_DIR}}/{{.AGENT}} declares no secret {{.NAME}}" >&2; exit 1; }
        value=$(cat | base64 | tr -d '\n')
        [ -n "$value" ] || { echo "empty value on stdin" >&2; exit 1; }
        { printf '%s\n' "$token"; echo "$line $value"; } | deploy/openbao/run.sh deploy/openbao/put.sh

  secrets:import:
    desc: Store every secret the agent declares in OpenBao from .env.AGENT (one-off migration from local env files)
    deps: [tapctl]
    requires: { vars: [AGENT] }
    cmds:
      - |
        token=$(deploy/openbao/token.sh) || exit 1
        env_file=.env.{{.AGENT}}
        [ -f "$env_file" ] || { echo "missing $env_file" >&2; exit 1; }
        paths=$(bin/tapctl secrets --paths {{.AGENTS_DIR}}/{{.AGENT}})
        [ -n "$paths" ] || { echo "{{.AGENTS_DIR}}/{{.AGENT}} declares no secrets"; exit 0; }
        lines=""
        for name in $(echo "$paths" | cut -d' ' -f1); do
          value=$(grep -E "^$name=" "$env_file" | tail -1 | cut -d= -f2-)
          [ -n "$value" ] || { echo "$env_file: $name is not set" >&2; exit 1; }
          where=$(echo "$paths" | awk -v n="$name" '$1 == n {print $2, $3}')
          lines="$lines$where $(printf '%s' "$value" | base64 | tr -d '\n')
        "
        done
        { printf '%s\n' "$token"; printf '%s' "$lines"; } | deploy/openbao/run.sh deploy/openbao/put.sh

  secrets:check:
    desc: Check OpenBao isolation from AGENT's identity (default probe-agent) against OTHER's secret (default countries-agent)
    deps: [tapctl]
    vars:
      AGENT: '{{.AGENT | default "probe-agent"}}'
      OTHER: '{{.OTHER | default "countries-agent"}}'
    cmds:
      - |
        own=$(bin/tapctl secrets --paths {{.AGENTS_DIR}}/{{.AGENT}} | head -1 | cut -d' ' -f3)
        other=$(bin/tapctl secrets --paths {{.AGENTS_DIR}}/{{.OTHER}} | head -1 | cut -d' ' -f3)
        [ -n "$own" ] && [ -n "$other" ] || { echo "both agents must declare a secret" >&2; exit 1; }
        ns=agent-{{.AGENT}}
        tok() { kubectl -n "$ns" create token "$1" --audience "$2" --duration 10m; }
        # kubectl prints tokens without a newline; check.sh reads one per line.
        { printf '%s\n' "$(tok tap-secrets openbao)"; printf '%s\n' "$(tok tap-secrets other)"; printf '%s\n' "$(tok agent openbao)"; } \
          | deploy/openbao/run.sh deploy/openbao/check.sh OWN="$own" OTHER="$other" NS="$ns" OTHER_NS=agent-{{.OTHER}}

  # ---- agents ---------------------------------------------------------------

  tapctl:
    desc: Build tapctl into bin/
    run: once
    sources: ["cmd/**/*.go", "pkg/**/*.go", "pkg/**/*.tmpl", "schema/*", "go.mod"]
    generates: [bin/tapctl]
    cmds:
      - go build -ldflags "{{.LDFLAGS}}" -o bin/tapctl ./cmd/tapctl

  docs:cli:
    desc: Regenerate docs/cli.md from tapctl's command table
    cmds:
      - go test ./cmd/tapctl -run TestCLIDocsUpToDate -update

  test:
    desc: Run Go tests
    cmds:
      - go test ./...

  agent:push:
    desc: Build and push the bundle under its immutable version tag; digest goes to .tap/AGENT.digest
    deps: [tapctl, registry:login]
    requires: { vars: [AGENT] }
    cmds:
      - bin/tapctl bundle build --push {{if .DEV}}--dev{{end}} --digest-file .tap/{{.AGENT}}.digest {{.AGENTS_DIR}}/{{.AGENT}}
      - task: sign
        vars: { REF: "$(cat .tap/{{.AGENT}}.digest)" }

  agent:test:
    desc: Run the agent's fixtures in its real runner image under gVisor (pushes a signed :dev bundle), then attest the passing run
    requires: { vars: [AGENT] }
    vars:
      BASE: '{{.BASE | default "git:origin/main"}}'
    cmds:
      - task: agent:push
        vars: { AGENT: "{{.AGENT}}", DEV: "true" }
      - silent: true
        cmd: |
          manifest=$(bin/tapctl render --test --bundle-file .tap/{{.AGENT}}.digest {{.AGENTS_DIR}}/{{.AGENT}})
          echo "$manifest" | kubectl apply -f - >/dev/null
          job=$(echo "$manifest" | awk '/^kind: Job/{f=1} f&&/^  name:/{print $2; exit}')
          echo "job tap-ci/$job"
          # Wait for either outcome; a failed Job never becomes Complete.
          for i in $(seq 1 120); do
            status=$(kubectl -n tap-ci get job "$job" -o jsonpath='{.status.conditions[?(@.status=="True")].type}')
            case "$status" in *Complete*|*Failed*) break;; esac
            sleep 2
          done
          kubectl -n tap-ci logs "job/$job" -c fixtures > .tap/{{.AGENT}}.test.log 2>/dev/null || true
          grep -vE '^\{"time"' .tap/{{.AGENT}}.test.log || true
          case "$status" in
            *Complete*) echo "$job" > .tap/{{.AGENT}}.test.job; exit 0;;
            *) echo "fixtures did not pass (status: ${status:-timeout})" >&2
               kubectl -n tap-ci describe job "$job" | tail -5 >&2; exit 1;;
          esac
      - task: agent:attest
        vars: { AGENT: "{{.AGENT}}", BASE: "{{.BASE}}" }

  agent:attest:
    internal: true
    silent: true
    requires: { vars: [AGENT, BASE] }
    deps: [signing:check]
    cmds:
      - |
        bin/tapctl attest --bundle-file .tap/{{.AGENT}}.digest --test-log .tap/{{.AGENT}}.test.log \
          --environment "cluster:tap-ci/$(cat .tap/{{.AGENT}}.test.job)" --base {{.BASE}} {{.AGENTS_DIR}}/{{.AGENT}} > .tap/{{.AGENT}}.predicate.json
      - |
        VAULT_TOKEN="$(deploy/openbao/token.sh)" cosign attest --key hashivault://tap-build --tlog-upload=false --yes \
          --type {{.PREDICATE_TYPE}} --predicate .tap/{{.AGENT}}.predicate.json "$(cat .tap/{{.AGENT}}.digest)" 2>&1 | grep -v '^WARNING' || true
      - |
        # The admission gate: a signature by the tested key, which nothing but
        # this task uses (Kyverno cannot verify attestations without Rekor).
        # The annotation links it to the attestation for humans; it is not checked.
        ref=$(cat .tap/{{.AGENT}}.digest)
        if ! cosign verify --key .tap/cosign-tested.pub --insecure-ignore-tlog=true "$ref" >/dev/null 2>&1; then
          VAULT_TOKEN="$(deploy/openbao/token.sh)" cosign sign --key hashivault://tap-tested --tlog-upload=false --yes \
            -a tap.hiddenfield.dev/attestation=sha256:$(shasum -a 256 .tap/{{.AGENT}}.predicate.json | cut -d' ' -f1) \
            "$ref" 2>&1 | grep -v '^WARNING' || true
        fi
      - task: agent:verify
        vars: { AGENT: "{{.AGENT}}" }

  agent:verify:
    desc: Verify the last pushed bundle's signature and fixtures attestation, as admission will
    requires: { vars: [AGENT] }
    deps: [signing:pubs]
    cmds:
      - silent: true
        cmd: |
          ref=$(cat .tap/{{.AGENT}}.digest)
          cosign verify --key .tap/cosign.pub --insecure-ignore-tlog=true "$ref" >/dev/null 2>&1 \
            || { echo "$ref: no valid signature" >&2; exit 1; }
          cosign verify --key .tap/cosign-tested.pub --insecure-ignore-tlog=true "$ref" >/dev/null 2>&1 \
            || { echo "$ref: no tested signature (run task agent:test)" >&2; exit 1; }
          cosign verify-attestation --key .tap/cosign.pub --insecure-ignore-tlog=true --type {{.PREDICATE_TYPE}} "$ref" 2>/dev/null \
            | tail -1 | python3 -c '
          import base64, json, sys
          line = sys.stdin.read().strip()
          if not line: sys.exit("no valid fixtures attestation")
          p = json.loads(base64.b64decode(json.loads(line)["payload"]))["predicate"]
          f = p["fixtures"]
          print("verified: signed and tested bundle; attestation by %s (%s) at %s" % (p["builder"]["user"], p["builder"]["tool"], p["builder"]["time"]))
          print("  fixtures: ok=%s passed=%d failed=%d skipped=%d (%s)" % (f["ok"], f["passed"], f["failed"], f["skipped"], f["environment"]))
          print("  permissions vs %s: %s" % (p["permissions"]["base"], "widened" if p["permissions"]["widens"] else "not widened"))
          sys.exit(0 if f["ok"] and f["failed"] == 0 else 1)'

  isolation:test:
    desc: Deploy probe-agent and verify tools cannot read secrets or reach undeclared networks
    cmds:
      # The probe only checks that its secret arrives; any value will do.
      - openssl rand -hex 16 | task secrets:put AGENT=probe-agent NAME=PROBE_TOKEN
      - task: agent:dev
        vars: { AGENT: probe-agent }
      - |
        # Give the network policy controller time to admit the new pod.
        sleep 8
        kubectl -n agent-probe-agent exec -i deploy/agent -c runner -- node --input-type=module - < tests/isolation/check.mjs

  agent:render:
    desc: Print the manifests for the last pushed bundle
    deps: [tapctl]
    requires: { vars: [AGENT] }
    cmds:
      - bin/tapctl render --bundle-file .tap/{{.AGENT}}.digest {{.AGENTS_DIR}}/{{.AGENT}}

  agent:secrets:
    desc: Wait for the agent's secrets, which tapctl render declares (ExternalSecrets from OpenBao, generated tokens, the egress key's PushSecret), then drop its entries from the legacy egress-keys and egress-policy
    deps: [tapctl]
    requires: { vars: [AGENT] }
    vars:
      NS: agent-{{.AGENT}}
    cmds:
      - |
        # The platform secrets agents read are pushed to OpenBao from tap-system.
        for ps in model-credentials trigger-token sessions-credentials; do
          kubectl -n {{.TAP_NS}} get pushsecret $ps >/dev/null 2>&1 || continue
          kubectl -n {{.TAP_NS}} wait pushsecret/$ps --for=condition=Ready --timeout=60s >/dev/null || {
            kubectl -n {{.TAP_NS}} get pushsecret $ps -o jsonpath='{.status.conditions[0].message}{"\n"}' >&2
            echo "tap-system/$ps is not in OpenBao; run: task platform:up (and task openbao:onboard if the role is missing)" >&2
            exit 1
          }
        done
      - |
        for es in $(kubectl -n {{.NS}} get externalsecret -o name); do
          kubectl -n {{.NS}} wait "$es" --for=condition=Ready --timeout=60s >/dev/null || {
            kubectl -n {{.NS}} get "$es" -o jsonpath='{.metadata.name}: {.status.conditions[0].message}{"\n"}' >&2
            case "$es" in */tool-secrets) echo "store the agent's secrets with: task secrets:put AGENT={{.AGENT}} NAME=<NAME>" >&2;; esac
            exit 1
          }
        done
      - |
        # The egress key reaches the proxy through OpenBao. Push it now: the
        # PushSecret may have run before ESO wrote the Secret.
        kubectl -n {{.NS}} get pushsecret egress-key >/dev/null 2>&1 || exit 0
        kubectl -n {{.NS}} annotate pushsecret egress-key force-sync=$(date +%s) --overwrite >/dev/null
        kubectl -n {{.NS}} wait pushsecret/egress-key --for=condition=Ready --timeout=60s >/dev/null || {
          kubectl -n {{.NS}} get pushsecret egress-key -o jsonpath='{.status.conditions[0].message}{"\n"}' >&2
          echo "the egress key is not in OpenBao; run: task openbao:onboard (tap-agent policy)" >&2
          exit 1
        }
      - |
        # Legacy entries (agent:deploy before phase 1). The proxy prefers the
        # OpenBao key and the labelled ConfigMap; drop the old copies.
        kubectl -n {{.TAP_NS}} patch secret egress-keys --type merge -p '{"data":{"{{.AGENT}}":null}}' >/dev/null 2>&1 || true
        kubectl -n {{.TAP_NS}} patch configmap egress-policy --type merge -p '{"data":{"{{.AGENT}}.json":null}}' >/dev/null 2>&1 || true

  agent:deploy:
    desc: Apply the manifests for the last pushed bundle and wait for rollout (agents Flux manages are deployed by merging to tap-agents; FORCE=1 overrides until Flux's next reconcile)
    deps: [tapctl]
    requires: { vars: [AGENT] }
    vars:
      NS: agent-{{.AGENT}}
    cmds:
      - |
        # Flux applies the agents from tap-agents' main; a hand deploy is
        # reverted at its next reconcile.
        owner=$(kubectl get namespace {{.NS}} -o jsonpath='{.metadata.labels.kustomize\.toolkit\.fluxcd\.io/name}' 2>/dev/null)
        if [ -n "$owner" ] && [ -z "{{.FORCE}}" ]; then
          echo "{{.NS}} is managed by Flux (Kustomization $owner): merge to tap-agents' main instead; the publish workflow tests, signs and Flux applies it. FORCE=1 deploys anyway, until the next reconcile." >&2
          exit 1
        fi
      - bin/tapctl render --bundle-file .tap/{{.AGENT}}.digest {{.AGENTS_DIR}}/{{.AGENT}} | kubectl apply -f -
      - task: agent:secrets
        vars: { AGENT: "{{.AGENT}}" }
      - kubectl -n {{.NS}} rollout status deploy/agent --timeout=180s
      - echo "https://{{.AGENT}}.a.hiddenfield.dev"

  agent:dev:
    desc: Inner loop - validate, test (signed :dev bundle + attestation), deploy
    requires: { vars: [AGENT] }
    cmds:
      - task: tapctl
      - bin/tapctl validate {{.AGENTS_DIR}}/{{.AGENT}}
      - task: agent:test
        vars: { AGENT: "{{.AGENT}}" }
      - task: agent:deploy
        vars: { AGENT: "{{.AGENT}}" }

  agent:launch:
    desc: "Launch a newly merged agent: up-to-date check, validate, secrets in OpenBao, test (signed :dev bundle), deploy, smoke chat. MESSAGE overrides the smoke question"
    requires: { vars: [AGENT] }
    vars:
      MESSAGE: '{{.MESSAGE | default "In one or two sentences, what can you help me with?"}}'
    cmds:
      - task: tapctl
      - |
        # 1. The merged agent, as it is on the agents repo's main.
        dir={{.AGENTS_DIR}}/{{.AGENT}}
        test -d "$dir" || { echo "$dir not found; merge its PR and pull main in the agents repo first" >&2; exit 1; }
        git -C "$dir" fetch -q origin main
        [ "$(git -C "$dir" rev-parse --abbrev-ref HEAD)" = main ] || { echo "switch the agents repo to main first (git checkout main && git pull)" >&2; exit 1; }
        [ "$(git -C "$dir" rev-parse HEAD)" = "$(git -C "$dir" rev-parse origin/main)" ] || { echo "the agents repo's main is not level with origin/main; run: git pull" >&2; exit 1; }
        git -C "$dir" diff --quiet HEAD -- . || { echo "$dir has local changes" >&2; exit 1; }
      - bin/tapctl validate {{.AGENTS_DIR}}/{{.AGENT}}
      - |
        # 2. Declared secrets must be in OpenBao before the pod starts.
        paths=$(bin/tapctl secrets --paths {{.AGENTS_DIR}}/{{.AGENT}})
        [ -n "$paths" ] || { echo "secrets: none declared"; exit 0; }
        token=$(deploy/openbao/token.sh) || exit 1
        result=$({ printf '%s\n' "$token"; echo "$paths"; } | deploy/openbao/run.sh deploy/openbao/present.sh)
        echo "$result" | sed 's/^/secrets: /'
        missing=$(echo "$result" | awk '$1 == "missing" {print $2}')
        if [ -n "$missing" ]; then
          echo "store each missing secret before launching:" >&2
          for n in $missing; do echo "  pbpaste | task secrets:put AGENT={{.AGENT}} NAME=$n" >&2; done
          exit 1
        fi
      # 3. The real gate: fixtures in the runner image under gVisor; signs the
      #    :dev bundle as tested and writes .tap/AGENT.digest for the deploy.
      - task: agent:test
        vars: { AGENT: "{{.AGENT}}" }
      - task: agent:deploy
        vars: { AGENT: "{{.AGENT}}" }
      - |
        # 4. Smoke: one chat turn from inside the pod (port-forward doesn't
        #    work under gVisor). New pods are briefly blocked by the network
        #    policy controller, hence the wait.
        sleep 10
        body=$(python3 -c 'import json,sys; print(json.dumps({"message": sys.argv[1]}))' "{{.MESSAGE}}")
        out=$(kubectl -n agent-{{.AGENT}} exec -i deploy/agent -c runner -- sh -c '
          body=$(cat)
          if command -v node >/dev/null; then
            node -e "fetch(\"http://127.0.0.1:8080/v1/chat\",{method:\"POST\",headers:{\"content-type\":\"application/json\"},body:process.argv[1]}).then(r=>r.text()).then(t=>process.stdout.write(t))" "$body"
          elif command -v python3 >/dev/null; then
            python3 -c "import sys,urllib.request as u; print(u.urlopen(u.Request(\"http://127.0.0.1:8080/v1/chat\",data=sys.argv[1].encode(),headers={\"content-type\":\"application/json\"}),timeout=120).read().decode())" "$body"
          else
            curl -sS -N -H "content-type: application/json" --data-binary "$body" http://127.0.0.1:8080/v1/chat
          fi' <<< "$body")
        echo "$out" | grep -q '^event: done' && ! echo "$out" | grep -q '^event: error' || {
          echo "smoke chat failed:" >&2; echo "$out" | tail -20 >&2
          echo "logs: task agent:logs AGENT={{.AGENT}}" >&2; exit 1; }
        echo "smoke: {{.MESSAGE}}"
        echo "$out" | python3 -c '
        import json, sys
        ev = None
        for line in sys.stdin:
            line = line.rstrip("\n")
            if line.startswith("event: "): ev = line[7:]
            elif line.startswith("data: ") and ev == "message":
                print("  " + (json.loads(line[6:]).get("content") or "").strip().replace("\n", "\n  ")[:600])'
      - bin/tapctl agent get {{.AGENT}}
      - echo "https://{{.AGENT}}.a.hiddenfield.dev"

  agent:logs:
    desc: Tail harness and runner logs
    requires: { vars: [AGENT] }
    cmds:
      - kubectl -n agent-{{.AGENT}} logs deploy/agent --all-containers --prefix -f --tail=100

  agent:destroy:
    desc: Delete the agent namespace
    requires: { vars: [AGENT] }
    prompt: Delete namespace agent-{{.AGENT}}?
    cmds:
      - kubectl delete namespace agent-{{.AGENT}} --wait
      # Rendered into tap-system with the agent; its OpenBao egress key stays
      # but grants nothing without this policy.
      - kubectl -n {{.TAP_NS}} delete configmap egress-policy-{{.AGENT}} --ignore-not-found

  # ---- session traces ---------------------------------------------------------

  sessions:setup:
    desc: Create the Tigris bucket for session traces, a write key for the casa-collector sidecars (tap-system/sessions-credentials) and a read-only key for the console's run history (tap-system/sessions-reader) and casa (.tap/sessions-reader.env)
    deps: [platform:ns]
    preconditions:
      - sh: '[ -n "{{.SESSIONS_BUCKET}}" ]'
        msg: platform.yaml has no sessions.bucket
      - sh: tigris whoami >/dev/null 2>&1
        msg: "not logged in to Tigris; run: tigris login"
    cmds:
      - mkdir -p .tap
      - tigris buckets get {{.SESSIONS_BUCKET}} >/dev/null 2>&1 || tigris buckets create {{.SESSIONS_BUCKET}} --access private
      - |
        test -f .tap/sessions-writer.env || \
          tigris access-keys create tap-sessions-writer --bucket {{.SESSIONS_BUCKET}} --role ReadWrite --env .tap/sessions-writer.env --for aws
        chmod 600 .tap/sessions-writer.env
      - |
        test -f .tap/sessions-reader.env || \
          tigris access-keys create tap-sessions-reader --bucket {{.SESSIONS_BUCKET}} --role ReadOnly --env .tap/sessions-reader.env --for aws
        chmod 600 .tap/sessions-reader.env
      - |
        set -a; . .tap/sessions-writer.env; set +a
        : "${AWS_ACCESS_KEY_ID:?.tap/sessions-writer.env has no AWS_ACCESS_KEY_ID}" "${AWS_SECRET_ACCESS_KEY:?.tap/sessions-writer.env has no AWS_SECRET_ACCESS_KEY}"
        kubectl -n {{.TAP_NS}} create secret generic sessions-credentials \
          --from-literal=access-key-id="$AWS_ACCESS_KEY_ID" --from-literal=secret-access-key="$AWS_SECRET_ACCESS_KEY" \
          --dry-run=client -o yaml | kubectl apply -f -
      - |
        set -a; . .tap/sessions-reader.env; set +a
        : "${AWS_ACCESS_KEY_ID:?.tap/sessions-reader.env has no AWS_ACCESS_KEY_ID}" "${AWS_SECRET_ACCESS_KEY:?.tap/sessions-reader.env has no AWS_SECRET_ACCESS_KEY}"
        kubectl -n {{.TAP_NS}} create secret generic sessions-reader \
          --from-literal=access-key-id="$AWS_ACCESS_KEY_ID" --from-literal=secret-access-key="$AWS_SECRET_ACCESS_KEY" \
          --dry-run=client -o yaml | kubectl apply -f -
        kubectl -n {{.TAP_NS}} rollout restart deploy/tap-console >/dev/null 2>&1 || true
      - echo "redeploy agents (task agent:deploy AGENT=...) to start exporting; the console shows runs; casa reads with .tap/sessions-reader.env"

  sessions:pull:
    desc: Download session traces for casa into .tap/sessions/<agent>/ (AGENT= for one agent), then e.g. casa analyze .tap/sessions/<agent>/
    vars:
      SRC: '{{if .AGENT}}{{.AGENT}}/{{end}}'
    cmds:
      - mkdir -p .tap/sessions{{if .AGENT}}/{{.AGENT}}{{end}}
      - tigris cp -r t3://{{.SESSIONS_BUCKET}}/{{.SRC}} .tap/sessions/{{if .AGENT}}{{.AGENT}}/{{end}}
      - find .tap/sessions -name '*.trace.json' | sed 's|/[^/]*$||' | sort | uniq -c

  # ---- factory (phase 9) ----------------------------------------------------

  factory:secrets:
    desc: Create the factory's own model client key, publisher token and egress key, and register its egress policy
    deps: [platform:ns]
    vars:
      NS: tap-factory
    cmds:
      - kubectl apply -f deploy/factory/namespace.yaml
      - |
        # Its own kodo-inference client, so it can be revoked without touching agents.
        mkdir -p .tap
        test -f .tap/factory-model.key || { touch .tap/factory-model.key; chmod 600 .tap/factory-model.key; openssl rand -hex 32 > .tap/factory-model.key; }
        kubectl -n kodo-inference patch secret kodo-inference-clients --type merge -p "{\"stringData\":{\"tap-factory\":\"$(cat .tap/factory-model.key)\"}}" >/dev/null
        kubectl -n {{.NS}} create secret generic model-credentials --from-file=api-key=.tap/factory-model.key --dry-run=client -o yaml | kubectl apply -f -
      - |
        kubectl -n {{.NS}} get secret publisher-token >/dev/null 2>&1 || \
          kubectl -n {{.NS}} create secret generic publisher-token --from-literal=token="$(openssl rand -hex 32)"
      - |
        # The proxy knows the factory as tap-factory, with a hand-written policy
        # (deploy/factory/egress-policy.json): bash may reach any public host on 443.
        # Its key stays in the legacy egress-keys Secret: the proxy looks keys up
        # in OpenBao by agent namespace (agent-<name>), and the factory has none.
        kubectl -n {{.NS}} get secret egress-key >/dev/null 2>&1 || \
          kubectl -n {{.NS}} create secret generic egress-key --from-literal=key="$(openssl rand -hex 32)"
        key=$(kubectl -n {{.NS}} get secret egress-key -o jsonpath='{.data.key}')
        kubectl -n {{.TAP_NS}} patch secret egress-keys --type merge -p "{\"data\":{\"tap-factory\":\"$key\"}}" >/dev/null
        kubectl -n {{.TAP_NS}} create configmap egress-policy-tap-factory --from-file=policy.json=deploy/factory/egress-policy.json --dry-run=client -o yaml \
          | kubectl label --local -f - tap.hiddenfield.dev/egress-policy=tap-factory -o yaml | kubectl apply -f - >/dev/null
        kubectl -n {{.TAP_NS}} patch configmap egress-policy --type merge -p '{"data":{"tap-factory.json":null}}' >/dev/null 2>&1 || true

  factory:github-token:
    desc: "Store the publisher's GitHub token in OpenBao from stdin (fine-grained: contents + pull requests on this repo only): pbpaste | task factory:github-token"
    cmds:
      - |
        token=$(deploy/openbao/token.sh) || exit 1
        value=$(cat | base64 | tr -d '\n')
        [ -n "$value" ] || { echo "empty value on stdin" >&2; exit 1; }
        { printf '%s\n' "$token"; echo "secret tap/tap-factory/github-token $value"; } | deploy/openbao/run.sh deploy/openbao/put.sh

  factory:deploy:
    desc: Apply deploy/factory (and the console's proxy) and wait for the factory
    cmds:
      - task: factory:secrets
      - kubectl apply -k deploy/factory
      - |
        kubectl -n tap-factory wait externalsecret/github-token --for=condition=Ready --timeout=60s >/dev/null || {
          echo "GitHub token not synced from OpenBao; store it with: pbpaste | task factory:github-token" >&2
          exit 1
        }
      - kubectl apply -f deploy/platform/egress-proxy.yaml -f deploy/platform/console.yaml -n {{.TAP_NS}}
      - kubectl -n tap-factory rollout status deploy/factory --timeout=300s

  factory:logs:
    desc: Tail the factory and publisher logs
    cmds:
      - kubectl -n tap-factory logs deploy/factory --all-containers --prefix -f --tail=100

  factory:submit:
    desc: "Submit a spec without the console: task factory:submit NAME=foo-agent SPEC=path/to/spec.md [RUNNER=runner-python] [PUBLISH=false] [ROUTE=agent]"
    requires: { vars: [NAME, SPEC] }
    cmds:
      - |
        python3 -c 'import json,sys; print(json.dumps({"name": sys.argv[1], "spec": open(sys.argv[2]).read(), "runner": sys.argv[3], "publish": sys.argv[4] == "true", "route": sys.argv[5]}))' \
          {{.NAME}} {{.SPEC}} {{.RUNNER | default "runner-node"}} {{.PUBLISH | default "true"}} {{.ROUTE | default "agent"}} \
          | kubectl -n tap-factory exec -i deploy/factory -c factory -- \
              curl -sS -X POST -H 'content-type: application/json' -H "x-tap-user: $(git config user.email)" --data-binary @- http://127.0.0.1:8080/v1/jobs
        echo

  factory:jobs:
    desc: List factory jobs (JOB=<id> shows one)
    cmds:
      - |
        kubectl -n tap-factory exec deploy/factory -c factory -- curl -sS -H "x-tap-user: $(git config user.email)" http://127.0.0.1:8080/v1/jobs/{{.JOB}}
        echo

  factory:eval:
    desc: Re-run the eval specs (factory/evals and the agents repo's agents/*/eval.md) as dry runs and score them; results go to .tap/evals/
    cmds:
      - mkdir -p .tap/evals
      - node --experimental-strip-types --disable-warning=ExperimentalWarning factory/evals/run.ts --agents-dir {{.AGENTS_DIR}} {{.CLI_ARGS}}
