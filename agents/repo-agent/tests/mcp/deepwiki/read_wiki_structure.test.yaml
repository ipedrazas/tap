tool: deepwiki__read_wiki_structure
cases:
  - name: lists wiki topics for an indexed repo
    args: { repoName: sindresorhus/slugify }
    mcp_response:
      content:
        - type: text
          text: "Available pages for sindresorhus/slugify:\n\n- 1 Overview\n- 2 API Reference\n  - 2.1 slugify Function\n  - 2.2 slugifyWithCounter Function\n  - 2.3 Configuration Options\n- 3 Implementation Details\n  - 3.1 String Transformation Pipeline\n  - 3.2 Counter Mechanism\n  - 3.3 Character Handling\n- 4 Usage Examples\n  - 4.1 Basic Examples\n  - 4.2 Advanced Examples\n- 5 Development Guide\n  - 5.1 Testing\n  - 5.2 Project Configuration"
      structuredContent:
        result: "Available pages for sindresorhus/slugify:\n\n- 1 Overview\n- 2 API Reference\n  - 2.1 slugify Function\n  - 2.2 slugifyWithCounter Function\n  - 2.3 Configuration Options\n- 3 Implementation Details\n  - 3.1 String Transformation Pipeline\n  - 3.2 Counter Mechanism\n  - 3.3 Character Handling\n- 4 Usage Examples\n  - 4.1 Basic Examples\n  - 4.2 Advanced Examples\n- 5 Development Guide\n  - 5.1 Testing\n  - 5.2 Project Configuration"
      isError: false
    expect:
      ok: true
      output_schema:
        type: object
        required: [result]
        properties:
          result: { type: string, minLength: 1 }
  - name: repository not indexed
    args: { repoName: ipedrazas/this-repo-does-not-exist-xyz }
    mcp_response:
      content:
        - type: text
          text: "Error fetching wiki for ipedrazas/this-repo-does-not-exist-xyz: Repository not found. Visit https://deepwiki.com/ipedrazas/this-repo-does-not-exist-xyz to index it."
      isError: true
    expect: { ok: false, error_kind: upstream }
  - name: missing repoName
    args: {}
    mcp_response: { content: [] }
    expect: { ok: false, error_kind: invalid_args }
  - name: repoName of the wrong type
    args: { repoName: 42 }
    mcp_response: { content: [] }
    expect: { ok: false, error_kind: invalid_args }
