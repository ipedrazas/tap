apiVersion: tavon.ai/agent/v1
kind: Agent
metadata:
  name: weather-agent
  version: 0.1.1
  owner: platform
  description: Answers weather questions for any city using the Open-Meteo API

harness:
  api: v1
  model:
    provider: gateway
    name: agent
  maxTurns: 12

effectsPolicy:
  write: deny
  irreversible: deny

prompt: system.md
skills:
  - skills/weather

runner:
  image: registry.hiddenfield.dev/tap/runner-python@sha256:71bdcf7eab61af0d57a98291f7bbb27aba9d1c82b70a422a6347b6734c2ee283
  timeout: 15s
  resources: { cpu: 250m, memory: 128Mi }

tools:
  - name: geocode
    description: Find a place's coordinates, country and timezone by name
    input_schema:
      type: object
      properties:
        name:
          type: string
          description: Place name, e.g. "Madrid" or "San Francisco"
          pattern: "^[A-Za-z\\x{00C0}-\\x{024F}][A-Za-z\\x{00C0}-\\x{024F} .'-]{0,63}$"
      required: [name]
      additionalProperties: false
    exec: ["python3", "tools/geocode.py", "--name", "{{name}}"]
    egress: [geocoding-api.open-meteo.com:443]
    effects: read

  - name: forecast
    description: Current conditions and a 3-day forecast for coordinates
    input_schema:
      type: object
      properties:
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
      required: [latitude, longitude]
      additionalProperties: false
    exec: ["python3", "tools/forecast.py", "--lat", "{{latitude}}", "--lon", "{{longitude}}"]
    egress: [api.open-meteo.com:443]
    effects: read

workspace:
  size: 64Mi
