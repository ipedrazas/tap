apiVersion: tavon.ai/agent/v1
kind: Agent
metadata:
  name: gh-pr-agent
  version: 0.1.0
  owner: "platform"
  description: "Reviews a GitHub pull request: fetches metadata, annotated diff and file context from the REST API, answering with at most five evidence-backed findings in chat"

harness:
  api: v1
  model:
    provider: gateway
    name: agent
  maxTurns: 25

# What the harness does before calling a write/irreversible tool: auto | deny | ask.
effectsPolicy:
  write: deny
  irreversible: deny

prompt: system.md
skills:
  - skills/gh-pr

runner:
  image: registry.hiddenfield.dev/tap/runner-node@sha256:43a4b81a8490d095a1d767d49a6aaf89e862f2dfe95636c2823c8c2332a44189
  timeout: 15s
  resources: { cpu: 250m, memory: 128Mi }

tools:
  - name: get_pull_request
    description: "Fetch a PR via GET /repos/{o}/{r}/pulls/{n}: title, body, author, state, draft, merged, shas, head_repo_full_name, additions, deletions, changed_files, labels. Call first to learn what the PR does and which shas to compare."
    input_schema:
      type: object
      properties:
        owner:
          type: string
          description: GitHub owner (user or organization), e.g. octocat
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$"
        repo:
          type: string
          description: GitHub repository name, e.g. Hello-World
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$"
        number:
          type: integer
          description: Pull request number
          minimum: 1
          maximum: 2147483647
      required: [owner, repo, number]
      additionalProperties: false
    exec: ["node", "tools/get_pull_request.ts", "--owner", "{{owner}}", "--repo", "{{repo}}", "--number", "{{number}}"]
    egress: [api.github.com:443]
    secrets: [GITHUB_TOKEN]
    effects: read

  - name: get_pull_request_diff
    description: "Fetch a PR changed files (pages 1-3, 100 per page) annotated per line with new-file line numbers; truncated at hunk boundaries (~60k chars per call). Continue with get_pull_request_diff_page; get a full file with get_pull_request_file_patch."
    input_schema:
      type: object
      properties:
        owner:
          type: string
          description: GitHub owner (user or organization), e.g. octocat
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$"
        repo:
          type: string
          description: GitHub repository name, e.g. Hello-World
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$"
        number:
          type: integer
          description: Pull request number
          minimum: 1
          maximum: 2147483647
      required: [owner, repo, number]
      additionalProperties: false
    exec: ["node", "tools/get_pull_request_diff.ts", "--owner", "{{owner}}", "--repo", "{{repo}}", "--number", "{{number}}"]
    egress: [api.github.com:443]
    secrets: [GITHUB_TOKEN]
    effects: read
    timeout: 30s

  - name: get_pull_request_diff_page
    description: "Fetch the next chunk (up to three pages) of a PR changed files starting at page. Same per-line annotation. If next_page is set, chain another call."
    input_schema:
      type: object
      properties:
        owner:
          type: string
          description: GitHub owner (user or organization), e.g. octocat
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$"
        repo:
          type: string
          description: GitHub repository name, e.g. Hello-World
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$"
        number:
          type: integer
          description: Pull request number
          minimum: 1
          maximum: 2147483647
        page:
          type: integer
          description: First page to fetch, from get_pull_request_diff's next_page (or another page call's next_page)
          minimum: 1
          maximum: 10000
      required: [owner, repo, number, page]
      additionalProperties: false
    exec: ["node", "tools/get_pull_request_diff_page.ts", "--owner", "{{owner}}", "--repo", "{{repo}}", "--number", "{{number}}", "--page", "{{page}}"]
    egress: [api.github.com:443]
    secrets: [GITHUB_TOKEN]
    effects: read
    timeout: 30s

  - name: get_pull_request_file_patch
    description: "Fetch the full annotated patch of one changed file by exact filename (pages the PR file list, at most 15 requests). Use when the diff tools truncated or skipped a file."
    input_schema:
      type: object
      properties:
        owner:
          type: string
          description: GitHub owner (user or organization), e.g. octocat
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$"
        repo:
          type: string
          description: GitHub repository name, e.g. Hello-World
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$"
        number:
          type: integer
          description: Pull request number
          minimum: 1
          maximum: 2147483647
        path:
          type: string
          description: Exact repository-relative filename from the diff output, e.g. lib/fs.js
          pattern: "^([^/.-][^/]*|\\.[^./][^/]*)(/([^/.][^/]*|\\.[^./][^/]*))*$"
      required: [owner, repo, number, path]
      additionalProperties: false
    exec: ["node", "tools/get_pull_request_file_patch.ts", "--owner", "{{owner}}", "--repo", "{{repo}}", "--number", "{{number}}", "--path", "{{path}}"]
    egress: [api.github.com:443]
    secrets: [GITHUB_TOKEN]
    effects: read
    timeout: 60s

  - name: get_file
    description: "Read a window (at most 400 lines) of one file at a ref via GET /repos/{o}/{r}/contents/{path}?ref={ref}. Use to read context the diff misses. Directories, binaries and deleted files return an error."
    input_schema:
      type: object
      properties:
        owner:
          type: string
          description: GitHub owner (user or organization) that has the ref; for fork PR head shas use the fork's owner from get_pull_request
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$"
        repo:
          type: string
          description: GitHub repository name that has the ref; for fork PR head shas use the fork's repo from get_pull_request
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$"
        path:
          type: string
          description: Repository-relative filename, e.g. lib/fs.js
          pattern: "^([^/.-][^/]*|\\.[^./][^/]*)(/([^/.][^/]*|\\.[^./][^/]*))*$"
        ref:
          type: string
          description: "40-hex commit sha (head sha for new code, base sha for old) or a branch name not starting with '-'"
          pattern: "^(?:[0-9a-f]{40}|[A-Za-z0-9][A-Za-z0-9._/-]{0,99})$"
        start_line:
          type: integer
          description: First line of the window (1-based)
          minimum: 1
          maximum: 100000000
        end_line:
          type: integer
          description: Last line of the window (1-based); at most 400 lines are returned
          minimum: 1
          maximum: 100000000
      required: [owner, repo, path, ref, start_line, end_line]
      additionalProperties: false
    exec: ["node", "tools/get_file.ts", "--owner", "{{owner}}", "--repo", "{{repo}}", "--path", "{{path}}", "--ref", "{{ref}}", "--start_line", "{{start_line}}", "--end_line", "{{end_line}}"]
    egress: [api.github.com:443]
    secrets: [GITHUB_TOKEN]
    effects: read
    timeout: 30s

secrets:
  GITHUB_TOKEN:
    from: vault://gh-pr-agent/token

workspace:
  size: 64Mi