tool: post_review_comment
cases:
  - name: posts_one_comment
    args: { owner: octocat, repo: Hello-World, number: 1, body: "**No issues worth raising.** Edits the README." }
    secrets: { GITHUB_TOKEN: stub }
    http:
      - method: POST
        url: "https://api.github.com/repos/octocat/Hello-World/issues/1/comments"
        status: 201
        headers: { content-type: application/json }
        body: { id: 1, html_url: "https://github.com/octocat/Hello-World/pull/1#issuecomment-1", body: "**No issues worth raising.** Edits the README." }
    expect:
      ok: true
      output_schema:
        type: object
        required: [posted, id, url]
        properties:
          posted: { const: true }
          id: { const: 1 }
          url: { const: "https://github.com/octocat/Hello-World/pull/1#issuecomment-1" }
  - name: read_only_token_is_forbidden
    args: { owner: octocat, repo: Hello-World, number: 1, body: "**No issues worth raising.**" }
    secrets: { GITHUB_TOKEN: stub }
    http:
      - { method: POST, url: "https://api.github.com/repos/octocat/Hello-World/issues/1/comments", status: 403, headers: { content-type: application/json }, body: { message: "Resource not accessible by personal access token", status: "403" } }
    expect:
      ok: true
      output_schema:
        type: object
        required: [error]
        properties: { error: { const: forbidden } }
  - name: locked_conversation_is_an_upstream_error
    args: { owner: octocat, repo: Hello-World, number: 1, body: "**No issues worth raising.**" }
    secrets: { GITHUB_TOKEN: stub }
    http:
      - { method: POST, url: "https://api.github.com/repos/octocat/Hello-World/issues/1/comments", status: 422, headers: { content-type: application/json }, body: { message: "Validation Failed", status: "422" } }
    expect:
      ok: true
      output_schema:
        type: object
        required: [error, status]
        properties: { error: { const: upstream }, status: { const: 422 } }
  - name: rejects_body_starting_with_dash
    args: { owner: octocat, repo: Hello-World, number: 1, body: "- looks fine" }
    secrets: { GITHUB_TOKEN: stub }
    expect: { ok: false, error_kind: invalid_args }
