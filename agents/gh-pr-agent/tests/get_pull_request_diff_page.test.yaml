tool: get_pull_request_diff_page
cases:
  - name: fetches_next_chunk
    args: {"owner":"nodejs","repo":"node","number":66673,"page":1}
    secrets: { GITHUB_TOKEN: stub }
    http:
      - { method: GET, url: "https://api.github.com/repos/nodejs/node/pulls/66673/files?per_page=100&page=1", status: 200, headers: { content-type: application/json }, body: [{"filename":"lib/fs.js","status":"modified","additions":27,"deletions":1,"changes":28,"patch":"@@ -1537,6 +1537,29 @@ function rmdirSync(path, options) {\n   binding.rmdir(path);\n }\n \n+/**\n+ * Asynchronously removes files and\n+ * directories (modeled on the standard POSIX `rm` utility).\n+ * @param {string | Buffer | URL} path\n+ * @param {{\n+ *   force?: boolean;\n+ *   maxRetries?: number;\n+ *   recursive?: boolean;\n+ *   retryDelay?: number;\n+ *   }} [options]\n+function normalizePathForRm(path) {\n+  if (typeof path === 'string') {\n+    return pathModule.normalize(path);\n+  }\n+  if (isArrayBufferView(path)) {\n+    const buf = Buffer.from(path.buffer, path.byteOffset, path.byteLength);\n+    const str = BufferToString(buf, 'latin1');\n+    const normalized = pathModule.normalize(str);\n+    return Buffer.from(normalized, 'latin1');\n+  }\n+  return path;\n+}\n+\n /**\n  * Asynchronously removes files and\n  * directories (modeled on the standard POSIX `rm` utility).\n@@ -1560,6 +1583,7 @@ function rm(path, options, callback) {\n   if (h !== null && vfsVoid(h.rm(path, options), callback)) return;\n \n   path = getValidatedPath(path);\n+  path = normalizePathForRm(path);\n \n   validateRmOptions(path, options, false, (err, options) => {\n     if (err) {\n@@ -1588,8 +1612,10 @@ function rmSync(path, options) {\n     const result = h.rmSync(path, options);\n     if (result !== undefined) return;\n   }\n+  path = getValidatedPath(path);\n+  path = normalizePathForRm(path);\n   const opts = validateRmOptionsSync(path, options, false);\n-  return binding.rmSync(getValidatedPath(path), opts.maxRetries, opts.recursive, opts.retryDelay);\n+  return binding.rmSync(path, opts.maxRetries, opts.recursive, opts.retryDelay);\n }\n \n /**"},{"filename":"lib/internal/fs/promises.js","status":"modified","additions":14,"deletions":0,"changes":14,"patch":"@@ -1600,13 +1600,27 @@ async function ftruncate(handle, len = 0) {\n   );\n }\n \n+function normalizePathForRm(path) {\n+  if (typeof path === 'string') {\n+    return pathModule.normalize(path);\n+  }\n+  if (isArrayBufferView(path)) {\n+    const buf = Buffer.from(path.buffer, path.byteOffset, path.byteLength);\n+    const str = BufferToString(buf, 'latin1');\n+    const normalized = pathModule.normalize(str);\n+    return Buffer.from(normalized, 'latin1');\n+  }\n+  return path;\n+}\n+\n async function rm(path, options) {\n   const h = vfsState.handlers;\n   if (h !== null) {\n     const promise = h.rm(path, options);\n     if (promise !== undefined) { await promise; return; }\n   }\n   path = getValidatedPath(path);\n+  path = normalizePathForRm(path);\n   options = await validateRmOptionsPromise(path, options, false);\n   return lazyRimRaf()(path, options);\n }"},{"filename":"test/parallel/test-fs-rm.js","status":"modified","additions":86,"deletions":0,"changes":86,"patch":"@@ -657,3 +657,89 @@ if (isGitPresent) {\n   // Clean up parent directory\n   fs.rmSync(dirname, { recursive: true, force: true });\n }\n+\n+// Test that rm/rmSync normalize '.' and '..' in paths before processing.\n+// Regression test for https://github.com/nodejs/node/issues/61958\n+{\n+  const cases = [\n+    { segments: ['a', 'b', '..', '.'], target: 'a' },\n+    { segments: ['a', 'b', '..'], target: 'a' },\n+    { segments: ['a', '.'], target: 'a' },\n+    { segments: ['a', 'b', 'c', '.'], target: path.join('a', 'b', 'c') },\n+    { segments: ['a', 'b', 'c', '..', '..'], target: 'a' },\n+    { segments: ['a', 'b', 'c', 'd', '..', '..', '..'], target: 'a' },\n+    { segments: ['a', 'b', '..', '.', 'b'], target: path.join('a', 'b') },\n+    { segments: ['.', 'a'], target: 'a' },\n+  ];\n+\n+  for (const { segments, target } of cases) {\n+    // rmSync with string path\n+    {\n+      const base = nextDirPath('rm-dot-sync-str');\n+      fs.mkdirSync(path.join(base, 'a', 'b', 'c', 'd'),\n+                   common.mustNotMutateObjectDeep({ recursive: true }));\n+      const weirdPath = [base, ...segments].join(path.sep);\n+      fs.rmSync(weirdPath, common.mustNotMutateObjectDeep({ recursive: true, force: true }));\n+      assert.strictEqual(fs.existsSync(path.join(base, target)), false);\n+    }\n+\n+    // rmSync with Buffer path\n+    {\n+      const base = nextDirPath('rm-dot-sync-buf');\n+      fs.mkdirSync(path.join(base, 'a', 'b', 'c', 'd'),\n+                   common.mustNotMutateObjectDeep({ recursive: true }));\n+      const weirdPath = Buffer.from([base, ...segments].join(path.sep));\n+      fs.rmSync(weirdPath, common.mustNotMutateObjectDeep({ recursive: true, force: true }));\n+      assert.strictEqual(fs.existsSync(path.join(base, target)), false);\n+    }\n+\n+    // fs.rm (callback) with string path\n+    {\n+      const base = nextDirPath('rm-dot-cb-str');\n+      fs.mkdirSync(path.join(base, 'a', 'b', 'c', 'd'),\n+                   common.mustNotMutateObjectDeep({ recursive: true }));\n+      const weirdPath = [base, ...segments].join(path.sep);\n+      fs.rm(weirdPath,\n+            common.mustNotMutateObjectDeep({ recursive: true, force: true }),\n+            common.mustSucceed(() => {\n+              assert.strictEqual(fs.existsSync(path.join(base, target)), false);\n+            }));\n+    }\n+\n+    // fs.promises.rm with string path\n+    {\n+      const base = nextDirPath('rm-dot-prom-str');\n+      fs.mkdirSync(path.join(base, 'a', 'b', 'c', 'd'),\n+                   common.mustNotMutateObjectDeep({ recursive: true }));\n+      const weirdPath = [base, ...segments].join(path.sep);\n+      fs.promises.rm(weirdPath,\n+                     common.mustNotMutateObjectDeep({ recursive: true, force: true }))\n+        .then(common.mustCall(() => {\n+          assert.strictEqual(fs.existsSync(path.join(base, target)), false);\n+        }));\n+    }\n+\n+    // fs.promises.rm with Buffer path\n+    {\n+      const base = nextDirPath('rm-dot-prom-buf');\n+      fs.mkdirSync(path.join(base, 'a', 'b', 'c', 'd'),\n+                   common.mustNotMutateObjectDeep({ recursive: true }));\n+      const weirdPath = Buffer.from([base, ...segments].join(path.sep));\n+      fs.promises.rm(weirdPath,\n+                     common.mustNotMutateObjectDeep({ recursive: true, force: true }))\n+        .then(common.mustCall(() => {\n+          assert.strictEqual(fs.existsSync(path.join(base, target)), false);\n+        }));\n+    }\n+  }\n+\n+  // Non-UTF-8 Buffer path byte preservation test\n+  {\n+    const base = nextDirPath('rm-dot-buf-latin1');\n+    fs.mkdirSync(path.join(base, 'a', 'b'),\n+                 common.mustNotMutateObjectDeep({ recursive: true }));\n+    const bufPath = Buffer.from([base, 'a', 'b', '..', '.'].join(path.sep));\n+    fs.rmSync(bufPath, common.mustNotMutateObjectDeep({ recursive: true, force: true }));\n+    assert.strictEqual(fs.existsSync(path.join(base, 'a')), false);\n+  }\n+}"}] }
    expect:
      ok: true
      output_schema: {"type":"object","required":["files","files_returned","next_page","omitted"],"properties":{"files_returned":{"const":3},"next_page":{"const":null},"files":{"type":"array","contains":{"type":"object","properties":{"filename":{"const":"lib/fs.js"}}}}}}
