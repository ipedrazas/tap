apiVersion: tavon.ai/agent/v1
kind: Agent
metadata:
  name: countries-agent
  version: 0.1.1
  owner: platform
  description: Answers questions about countries (capital, population, area, languages, currencies, neighbours, region) and compares two countries, using the REST Countries API.

harness:
  api: v1
  model:
    provider: gateway
    name: agent
  maxTurns: 12

# What the harness does before calling a write/irreversible tool: auto | deny | ask.
effectsPolicy:
  write: deny
  irreversible: deny

prompt: system.md
skills:
  - skills/countries

runner:
  image: registry.hiddenfield.dev/tap/runner-node@sha256:e37dc3d07c859b1249600a87c1bdabb4af8b3ad2c9e00c76437ea3c93f8d952a
  timeout: 15s
  resources: { cpu: 250m, memory: 128Mi }

tools:
  - name: get_country
    description: Facts about one country by name or ISO code (e.g. "France", "Côte d'Ivoire", "DE", "BRA"). Returns capital, population, area, density, languages, currencies, neighbouring countries, region and subregion.
    input_schema:
      type: object
      properties:
        country:
          type: string
          description: Country name (common, official or native) or ISO 3166-1 alpha-2/alpha-3 code
          pattern: "^\\p{L}[\\p{L} .'(),&-]{0,59}$"
      required: [country]
      additionalProperties: false
    exec: ["node", "tools/get_country.ts", "--country", "{{country}}"]
    egress: [api.restcountries.com:443]
    secrets: [RESTCOUNTRIES_API_KEY]
    effects: read

  - name: compare_countries
    description: Compare two countries side by side (by name or ISO code). Returns both countries' facts plus population, area and density ratios (first / second), whether they share a border, region, languages or currencies.
    input_schema:
      type: object
      properties:
        first:
          type: string
          description: First country name or ISO alpha-2/alpha-3 code
          pattern: "^\\p{L}[\\p{L} .'(),&-]{0,59}$"
        second:
          type: string
          description: Second country name or ISO alpha-2/alpha-3 code
          pattern: "^\\p{L}[\\p{L} .'(),&-]{0,59}$"
      required: [first, second]
      additionalProperties: false
    exec: ["node", "tools/compare_countries.ts", "--first", "{{first}}", "--second", "{{second}}"]
    egress: [api.restcountries.com:443]
    secrets: [RESTCOUNTRIES_API_KEY]
    effects: read

secrets:
  RESTCOUNTRIES_API_KEY:
    from: vault://countries-agent/restcountries-api-key

workspace:
  size: 64Mi
