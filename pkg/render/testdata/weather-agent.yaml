# Rendered by tapctl from weather-agent 0.1.1; do not edit.
apiVersion: v1
kind: Namespace
metadata:
  name: agent-weather-agent
  labels:
    tap.hiddenfield.dev/agent: weather-agent
    tap.hiddenfield.dev/owner: platform
    # baseline, not restricted: the runner needs SETUID/SETGID/CHOWN/KILL to
    # run each tool under its own uid. Everything else meets restricted.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent
  namespace: agent-weather-agent
automountServiceAccountToken: false
---
# Default deny; everything below opens one path.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: agent-weather-agent
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingress-from-gateway
  namespace: agent-weather-agent
spec:
  podSelector:
    matchLabels: { tap.hiddenfield.dev/agent: weather-agent }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: envoy-gateway-system }
          podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: tap
              gateway.envoyproxy.io/owning-gateway-namespace: tap-system
      ports:
        - { protocol: TCP, port: 8080 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress-dns-and-model
  namespace: agent-weather-agent
spec:
  podSelector:
    matchLabels: { tap.hiddenfield.dev/agent: weather-agent }
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: envoy-gateway-system }
          podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: kodo-inference
              gateway.envoyproxy.io/owning-gateway-namespace: kodo-inference
      ports:
        - { protocol: TCP, port: 10080 }
    # Tool traffic leaves only through the egress proxy.
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: tap-system }
          podSelector:
            matchLabels: { app: egress-proxy }
      ports:
        - { protocol: TCP, port: 3128 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  namespace: agent-weather-agent
  labels: &labels
    app.kubernetes.io/name: weather-agent
    app.kubernetes.io/version: 0.1.1
    tap.hiddenfield.dev/agent: weather-agent
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: { tap.hiddenfield.dev/agent: weather-agent }
  template:
    metadata:
      labels: *labels
      annotations:
        tap.hiddenfield.dev/bundle: registry.hiddenfield.dev/agents/echo-agent@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
        tap.hiddenfield.dev/spec-hash: sha256:98b00f9681f576ba84f62e3818260e0e5a92427f32eb149f58dcf272062e07b3
    spec:
      runtimeClassName: gvisor
      serviceAccountName: agent
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        # Native sidecar: the only container that runs tool code or holds tool secrets.
        - name: runner
          image: registry.hiddenfield.dev/tap/runner-python@sha256:71bdcf7eab61af0d57a98291f7bbb27aba9d1c82b70a422a6347b6734c2ee283
          restartPolicy: Always
          args:
            - --bundle=/bundle
            - --listen=127.0.0.1:7070
            - --token-file=/run/tap/token/token
            - --secrets-dir=/run/tap/secrets
            - --workspace=/workspace
            - --tool-uid-base=61000
            - --egress-proxy=egress-proxy.tap-system.svc.cluster.local:3128
            - --egress-key-file=/run/tap/egress/key
          env:
            - { name: TAP_AGENT, value: weather-agent }
          startupProbe:
            exec: { command: [tap-runner, health, --listen=127.0.0.1:7070] }
            periodSeconds: 1
            failureThreshold: 30
          livenessProbe:
            exec: { command: [tap-runner, health, --listen=127.0.0.1:7070] }
            periodSeconds: 20
          resources:
            requests: { cpu: 250m, memory: 128Mi }
            limits: { memory: 128Mi }
          # Root inside the gVisor sandbox with four capabilities, so tools can
          # run as other uids and never read the runner's secret files (0440,
          # group fsGroup; tools have neither).
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL], add: [SETUID, SETGID, CHOWN, KILL] }
          volumeMounts:
            - { name: bundle, subPath: runner, mountPath: /bundle, readOnly: true }
            - { name: workspace, mountPath: /workspace }
            - { name: runner-tmp, mountPath: /tmp }
            - { name: token, mountPath: /run/tap/token, readOnly: true }
            - { name: egress-key, mountPath: /run/tap/egress, readOnly: true }
      containers:
        - name: harness
          image: registry.hiddenfield.dev/tap/harness@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          args:
            - --bundle=/bundle
            - --listen=:8080
            - --runner=http://127.0.0.1:7070
            - --token-file=/run/tap/token/token
            - --model-base-url=http://kodo-inference.envoy-gateway-system.svc.cluster.local/v1
            - --model-key-header=x-kodo-gateway-key
            - --model-key-file=/run/tap/model/api-key
            - --workspace=/workspace
          env:
            - { name: TAP_AGENT, value: weather-agent }
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: bundle, subPath: harness, mountPath: /bundle, readOnly: true }
            - { name: workspace, mountPath: /workspace }
            - { name: harness-tmp, mountPath: /tmp }
            - { name: token, mountPath: /run/tap/token, readOnly: true }
            - { name: model-credentials, mountPath: /run/tap/model, readOnly: true }
      volumes:
        - name: bundle
          image:
            reference: registry.hiddenfield.dev/agents/echo-agent@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
            pullPolicy: IfNotPresent
        - name: workspace
          emptyDir: { sizeLimit: 64Mi }
        - name: runner-tmp
          emptyDir: { medium: Memory, sizeLimit: 64Mi }
        - name: harness-tmp
          emptyDir: { medium: Memory, sizeLimit: 64Mi }
        # Shared secret for harness -> runner calls on loopback (created by `task agent:secrets`).
        - name: token
          secret: { secretName: runner-token, defaultMode: 0440 }
        # Harness only: the model gateway key. Never mounted into the runner.
        - name: model-credentials
          secret: { secretName: model-credentials, defaultMode: 0440 }
        - name: egress-key
          secret: { secretName: egress-key, defaultMode: 0440 }
---
apiVersion: v1
kind: Service
metadata:
  name: agent
  namespace: agent-weather-agent
spec:
  selector: { tap.hiddenfield.dev/agent: weather-agent }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agent
  namespace: agent-weather-agent
spec:
  parentRefs:
    - name: tap
      namespace: tap-system
      sectionName: agents
  hostnames: [weather-agent.a.hiddenfield.dev]
  rules:
    - backendRefs:
        - { name: agent, port: 80 }
      timeouts:
        # Chat responses stream for as long as the agent loop runs.
        request: 0s
