# Rendered by tapctl from countries-agent 0.1.2; do not edit.
apiVersion: v1
kind: Namespace
metadata:
  name: agent-countries-agent
  labels:
    tap.hiddenfield.dev/agent: countries-agent
    tap.hiddenfield.dev/owner: "platform"
    # Kyverno's webhooks see only labelled namespaces (tapctl admission policy).
    tap.hiddenfield.dev/admission: verify
    # baseline, not restricted: the runner needs SETUID/SETGID/CHOWN/KILL to
    # run each tool under its own uid. Everything else meets restricted.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent
  namespace: agent-countries-agent
automountServiceAccountToken: false
---
# External Secrets Operator logs in to OpenBao as this account (audience
# openbao). OpenBao lets it read secret/tap/agent-countries-agent/* and the
# platform secrets under tap-platform/, and write tap-egress/agent-countries-agent.
# No pod runs as it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tap-secrets
  namespace: agent-countries-agent
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
  namespace: agent-countries-agent
spec:
  provider:
    vault:
      server: https://openbao.alacasa.uk:8443
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes-tap
          role: tap-agent
          serviceAccountRef:
            name: tap-secrets
            audiences: [openbao]
---
# The runner's tool-secrets Secret, one key per declared secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tool-secrets
  namespace: agent-countries-agent
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: SecretStore, name: openbao }
  target:
    name: tool-secrets
    creationPolicy: Owner
  data:
    - secretKey: RESTCOUNTRIES_API_KEY
      remoteRef: { key: tap/agent-countries-agent/restcountries-api-key, property: value }
---
# Harness only: the model gateway key, shared by every agent.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: model-credentials
  namespace: agent-countries-agent
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: SecretStore, name: openbao }
  target:
    name: model-credentials
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef: { key: tap-platform/model-credentials, property: api-key }
---
# Harness only: what tap-hooks sends to the trigger port.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: trigger-token
  namespace: agent-countries-agent
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: SecretStore, name: openbao }
  target:
    name: trigger-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef: { key: tap-platform/trigger-token, property: token }
---
# casa-collector only: the write key for the session trace bucket.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sessions-credentials
  namespace: agent-countries-agent
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: SecretStore, name: openbao }
  target:
    name: sessions-credentials
    creationPolicy: Owner
  data:
    - secretKey: access-key-id
      remoteRef: { key: tap-platform/sessions-credentials, property: access-key-id }
    - secretKey: secret-access-key
      remoteRef: { key: tap-platform/sessions-credentials, property: secret-access-key }
---
# Harness -> runner bearer token on loopback. Generated once; never rotated
# by a sync (both containers read it at startup).
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: runner-token
  namespace: agent-countries-agent
spec:
  length: 64
  digits: 16
  symbols: 0
  noUpper: false
  allowRepeat: true
  secretKeys: [token]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: runner-token
  namespace: agent-countries-agent
spec:
  refreshPolicy: CreatedOnce
  target:
    name: runner-token
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef: { apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: runner-token }
---
# The agent's egress key: the runner and casa-collector sign per-call proxy
# credentials with it. Generated once here, pushed to OpenBao, and read from
# there by the egress proxy.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: egress-key
  namespace: agent-countries-agent
spec:
  length: 64
  digits: 16
  symbols: 0
  noUpper: false
  allowRepeat: true
  secretKeys: [key]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: egress-key
  namespace: agent-countries-agent
spec:
  refreshPolicy: CreatedOnce
  target:
    name: egress-key
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef: { apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: egress-key }
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: egress-key
  namespace: agent-countries-agent
spec:
  # Short, so a regenerated key (a deleted Secret, or ESO adopting an old
  # one) reaches OpenBao, and the proxy, within a minute or so.
  refreshInterval: 1m
  updatePolicy: Replace
  # Not Delete: the finalizer would need this namespace's SecretStore while
  # the namespace is being deleted. A leftover key grants nothing, because
  # the proxy also requires the agent's policy ConfigMap, which goes with it.
  deletionPolicy: None
  secretStoreRefs:
    - { kind: SecretStore, name: openbao }
  selector:
    secret: { name: egress-key }
  data:
    - match:
        secretKey: key
        remoteRef: { remoteKey: tap-egress/agent-countries-agent, property: key }
---
# The agent's egress allowlist. The proxy watches ConfigMaps with this label
# in its own namespace; the label value is the agent.
apiVersion: v1
kind: ConfigMap
metadata:
  name: egress-policy-countries-agent
  namespace: tap-system
  labels:
    tap.hiddenfield.dev/egress-policy: countries-agent
data:
  policy.json: "{\"collector:sessions\":[\"t3.storage.dev:443\"],\"compare_countries\":[\"api.restcountries.com:443\"],\"get_country\":[\"api.restcountries.com:443\"]}"
---
# Default deny; everything below opens one path.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: agent-countries-agent
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingress-from-gateway
  namespace: agent-countries-agent
spec:
  podSelector:
    matchLabels: { tap.hiddenfield.dev/agent: countries-agent }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: envoy-gateway-system }
          podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: tap
              gateway.envoyproxy.io/owning-gateway-namespace: tap-system
      ports:
        - { protocol: TCP, port: 8080 }
---
# Hook triggers: only tap-hooks, on a port the gateway never routes to.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingress-from-hooks
  namespace: agent-countries-agent
spec:
  podSelector:
    matchLabels: { tap.hiddenfield.dev/agent: countries-agent }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: tap-system }
          podSelector:
            matchLabels: { app: tap-hooks }
      ports:
        - { protocol: TCP, port: 8081 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress-dns-and-model
  namespace: agent-countries-agent
spec:
  podSelector:
    matchLabels: { tap.hiddenfield.dev/agent: countries-agent }
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: envoy-gateway-system }
          podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: kodo-inference
              gateway.envoyproxy.io/owning-gateway-namespace: kodo-inference
      ports:
        - { protocol: TCP, port: 10080 }
    # Tool traffic (and casa-collector's session uploads) leave only through the egress proxy.
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: tap-system }
          podSelector:
            matchLabels: { app: egress-proxy }
      ports:
        - { protocol: TCP, port: 3128 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  namespace: agent-countries-agent
  # Read by `tapctl agent ls` and the console (quoted so any text is valid YAML).
  annotations:
    tap.hiddenfield.dev/description: "Answers questions about countries (capital, population, area, languages, currencies, neighbours, region) and compares two countries, using the REST Countries API."
    tap.hiddenfield.dev/owner: "platform"
    tap.hiddenfield.dev/model: "agent"
    tap.hiddenfield.dev/tools: "get_country,compare_countries"
    tap.hiddenfield.dev/mcp: ""
    tap.hiddenfield.dev/egress: "api.restcountries.com:443"
    tap.hiddenfield.dev/url: "https://countries-agent.a.hiddenfield.dev"
  labels: &labels
    app.kubernetes.io/name: countries-agent
    app.kubernetes.io/version: "0.1.2"
    tap.hiddenfield.dev/agent: countries-agent
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: { tap.hiddenfield.dev/agent: countries-agent }
  template:
    metadata:
      labels: *labels
      annotations:
        tap.hiddenfield.dev/bundle: registry.hiddenfield.dev/agents/echo-agent@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
        tap.hiddenfield.dev/spec-hash: sha256:e541118156fc918afc0d87d95ce939bd99389027e99180b9615517007669093c
    spec:
      runtimeClassName: gvisor
      serviceAccountName: agent
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        # Native sidecar: the only container that runs tool code or holds tool secrets.
        - name: runner
          image: registry.hiddenfield.dev/tap/runner-node@sha256:43a4b81a8490d095a1d767d49a6aaf89e862f2dfe95636c2823c8c2332a44189
          restartPolicy: Always
          args:
            - --bundle=/bundle
            - --listen=127.0.0.1:7070
            - --token-file=/run/tap/token/token
            - --secrets-dir=/run/tap/secrets
            - --workspace=/workspace
            - --tool-uid-base=61000
            - --egress-proxy=egress-proxy.tap-system.svc.cluster.local:3128
            - --egress-key-file=/run/tap/egress/key
          env:
            - { name: TAP_AGENT, value: countries-agent }
          startupProbe:
            exec: { command: [tap-runner, health, --listen=127.0.0.1:7070] }
            periodSeconds: 1
            failureThreshold: 30
          livenessProbe:
            exec: { command: [tap-runner, health, --listen=127.0.0.1:7070] }
            periodSeconds: 20
          resources:
            requests: { cpu: 250m, memory: 128Mi }
            limits: { memory: 128Mi }
          # Root inside the gVisor sandbox with four capabilities, so tools can
          # run as other uids and never read the runner's secret files (0440,
          # group fsGroup; tools have neither).
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL], add: [SETUID, SETGID, CHOWN, KILL] }
          volumeMounts:
            - { name: bundle, subPath: runner, mountPath: /bundle, readOnly: true }
            - { name: workspace, mountPath: /workspace }
            - { name: runner-tmp, mountPath: /tmp }
            - { name: token, mountPath: /run/tap/token, readOnly: true }
            - { name: tool-secrets, mountPath: /run/tap/secrets, readOnly: true }
            - { name: egress-key, mountPath: /run/tap/egress, readOnly: true }
        # Native sidecar: uploads the traces the harness writes to /traces. The
        # only container holding the bucket key. It stops after the harness,
        # so its final scan picks up the last turn.
        - name: casa-collector
          image: registry.hiddenfield.dev/tap/casa-collector@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
          restartPolicy: Always
          args:
            - --dir=/traces
            # The agent's own prefix: the harness cannot write another agent's keys.
            - --prefix=countries-agent
            - --endpoint=https://t3.storage.dev
            - --bucket=hiddenfield-tap-sessions
            - --region=auto
            - --credentials-dir=/run/tap/sessions
            - --egress-proxy=egress-proxy.tap-system.svc.cluster.local:3128
            - --egress-key-file=/run/tap/egress/key
            - --egress-agent=countries-agent
            - --egress-scope=collector:sessions
            - --max-size=16777216
            # Within the pod's 30s grace period, after the harness's 20s.
            - --drain-timeout=5s
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: traces, mountPath: /traces, readOnly: true }
            - { name: egress-key, mountPath: /run/tap/egress, readOnly: true }
            - { name: sessions-credentials, mountPath: /run/tap/sessions, readOnly: true }
      containers:
        - name: harness
          image: registry.hiddenfield.dev/tap/harness@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          args:
            - --bundle=/bundle
            - --listen=:8080
            - --runner=http://127.0.0.1:7070
            - --token-file=/run/tap/token/token
            - --model-base-url=http://kodo-inference.envoy-gateway-system.svc.cluster.local/v1
            - --model-key-header=x-kodo-gateway-key
            - --model-key-file=/run/tap/model/api-key
            - --workspace=/workspace
            - --trigger-listen=:8081
            - --trigger-token-file=/run/tap/trigger/token
            - --traces-dir=/traces
          env:
            - { name: TAP_AGENT, value: countries-agent }
          ports:
            - { name: http, containerPort: 8080 }
            - { name: trigger, containerPort: 8081 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: bundle, subPath: harness, mountPath: /bundle, readOnly: true }
            - { name: workspace, mountPath: /workspace }
            - { name: harness-tmp, mountPath: /tmp }
            - { name: token, mountPath: /run/tap/token, readOnly: true }
            - { name: model-credentials, mountPath: /run/tap/model, readOnly: true }
            - { name: trigger-token, mountPath: /run/tap/trigger, readOnly: true }
            - { name: traces, mountPath: /traces }
      volumes:
        - name: bundle
          image:
            reference: registry.hiddenfield.dev/agents/echo-agent@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
            pullPolicy: IfNotPresent
        - name: workspace
          emptyDir: { sizeLimit: 64Mi }
        - name: runner-tmp
          emptyDir: { medium: Memory, sizeLimit: 64Mi }
        - name: harness-tmp
          emptyDir: { medium: Memory, sizeLimit: 64Mi }
        # Shared secret for harness -> runner calls on loopback (generated above).
        - name: token
          secret: { secretName: runner-token, defaultMode: 0440 }
        # Harness only: the model gateway key. Never mounted into the runner.
        - name: model-credentials
          secret: { secretName: model-credentials, defaultMode: 0440 }
        - name: tool-secrets
          secret: { secretName: tool-secrets, defaultMode: 0440 }
        # Harness only: what tap-hooks sends to the trigger port. Tools share
        # the pod's loopback, so the NetworkPolicy alone does not keep them off it.
        - name: trigger-token
          secret: { secretName: trigger-token, defaultMode: 0440 }
        - name: egress-key
          secret: { secretName: egress-key, defaultMode: 0440 }
        # Harness and collector only (not the workspace, which tools can write):
        # session traces waiting to be uploaded.
        - name: traces
          emptyDir: { sizeLimit: 64Mi }
        # Collector only: the write key for the session trace bucket.
        - name: sessions-credentials
          secret: { secretName: sessions-credentials, defaultMode: 0440 }
---
apiVersion: v1
kind: Service
metadata:
  name: agent
  namespace: agent-countries-agent
spec:
  selector: { tap.hiddenfield.dev/agent: countries-agent }
  ports:
    - { name: http, port: 80, targetPort: http }
    # Not referenced by the HTTPRoute; tap-hooks calls it directly.
    - { name: trigger, port: 8081, targetPort: trigger }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agent
  namespace: agent-countries-agent
spec:
  parentRefs:
    - name: tap
      namespace: tap-system
      sectionName: agents
  hostnames: [countries-agent.a.hiddenfield.dev]
  rules:
    - backendRefs:
        - { name: agent, port: 80 }
      timeouts:
        # Chat responses stream for as long as the agent loop runs.
        request: 0s
