# Checks that need no cluster, registry or signing keys. Agents are checked in
# their own repository (ipedrazas/tap-agents), with a tap release. The in-cluster gate
# (task agent:test: runner image, gVisor, signing) runs on a self-hosted runner
# with an OpenBao token for the Transit signing keys (tap-signer,
# tap-tested-signer).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  # platform.yml runs these checks before it builds anything.
  workflow_call:

permissions:
  contents: read

# github.workflow is the caller's name when platform.yml calls this, so its
# run doesn't cancel (or get cancelled by) ci's own run on the same push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd pkg schema casa-collector)
          [ -z "$unformatted" ] || { echo "::error::not gofmt'd: $unformatted"; exit 1; }
      - run: go vet ./...
      # Includes the golden render tests and the docs/cli.md staleness check.
      - run: go test ./...
      # casa-collector is its own module (to move to its own repository), so
      # ./... above does not reach it.
      - run: go vet ./... && go test ./...
        working-directory: casa-collector

  factory:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: factory
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Same Node as images/factory and images/runner-node.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.3
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  # deploy/flux/applier-policy.yaml against what tapctl render and the apps
  # layer emit, in a throwaway kind cluster.
  applier-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go install sigs.k8s.io/kind@v0.33.0
      - run: ci/test-applier-policy.sh
