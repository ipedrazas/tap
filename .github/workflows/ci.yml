# Checks that need no cluster, registry or signing keys. The in-cluster gate
# (task agent:test: runner image, gVisor, signing) runs on a self-hosted runner
# once the keys live in OpenBao (phase 8).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd pkg schema)
          [ -z "$unformatted" ] || { echo "::error::not gofmt'd: $unformatted"; exit 1; }
      - run: go vet ./...
      # Includes the golden render tests and the docs/cli.md staleness check.
      - run: go test ./...

  agents:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tapctl diff reads the base branch's agent.yaml
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Same interpreter versions as images/runner-node and images/runner-python.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.3
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.16
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.46.4
          repo-token: ${{ github.token }}
      - run: task tapctl
      - name: validate, diff, fixtures
        env:
          BASE: git:origin/${{ github.base_ref || 'main' }}
        run: |
          failed=0
          echo "## Agents (permission diff vs ${BASE#git:})" >> "$GITHUB_STEP_SUMMARY"
          for dir in agents/*/; do
            agent=$(basename "$dir")
            echo "::group::$agent"
            bin/tapctl validate "$dir" || { echo "::error::$agent: validation failed"; failed=1; }
            set +e
            diff=$(bin/tapctl diff --base "$BASE" "$dir" 2>&1); rc=$?
            set -e
            echo "$diff"
            case $rc in
              0) ;;
              3) echo "::warning::$agent: permissions widened; human review required"
                 { echo "### $agent: permissions widened"; echo '```'; echo "$diff"; echo '```'; } >> "$GITHUB_STEP_SUMMARY" ;;
              *) echo "::error::$agent: diff failed (exit $rc)"; failed=1 ;;
            esac
            task agent:test:local AGENT="$agent" NODE="$(command -v node)" PYTHON="$(command -v python3)" \
              || { echo "::error::$agent: fixtures failed"; failed=1; }
            echo "::endgroup::"
          done
          exit $failed
