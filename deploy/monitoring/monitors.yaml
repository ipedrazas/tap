# What Prometheus scrapes besides the chart's own targets (Kubernetes, the
# kubelets, kube-state-metrics, node-exporter). Applied by
# `task monitoring:install`.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cert-manager
  namespace: monitoring
spec:
  namespaceSelector: { matchNames: [cert-manager] }
  selector:
    matchLabels: { app.kubernetes.io/name: cert-manager, app.kubernetes.io/component: controller }
  endpoints:
    - { port: http-metrics, interval: 60s }
---
# The External Secrets metrics Service exists once deploy/external-secrets/values.yaml
# has metrics.service.enabled (task secrets:install).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: external-secrets
  namespace: monitoring
spec:
  namespaceSelector: { matchNames: [external-secrets] }
  selector:
    matchLabels: { app.kubernetes.io/name: external-secrets }
  endpoints:
    - { port: metrics, interval: 60s }
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kyverno
  namespace: monitoring
spec:
  namespaceSelector: { matchNames: [kyverno] }
  selector:
    matchLabels: { app.kubernetes.io/part-of: kyverno }
  endpoints:
    - { port: metrics-port, interval: 60s }
---
# Flux's controllers (reconcile errors and durations); their readiness comes
# from kube-state-metrics (values.yaml). flux-system's allow-scraping policy
# admits this.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: flux
  namespace: monitoring
spec:
  namespaceSelector: { matchNames: [flux-system] }
  selector:
    matchExpressions:
      - { key: app, operator: In, values: [source-controller, kustomize-controller, notification-controller] }
  podMetricsEndpoints:
    - { port: http-prom, interval: 60s }
