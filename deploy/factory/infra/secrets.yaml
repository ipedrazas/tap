# The publisher's GitHub token comes from OpenBao (secret/tap/tap-factory/
# github-token, stored with `task factory:github-token`). The phase 8 policy
# lets tap-secrets in this namespace read secret/tap/tap-factory/* only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tap-secrets
  namespace: tap-factory
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
  namespace: tap-factory
spec:
  provider:
    vault:
      server: https://openbao.alacasa.uk:8443
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes-tap
          role: tap-agent
          serviceAccountRef:
            name: tap-secrets
            audiences: [openbao]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-token
  namespace: tap-factory
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: SecretStore, name: openbao }
  target:
    name: github-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef: { key: tap/tap-factory/github-token, property: value }
