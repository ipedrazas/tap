apiVersion: v1
kind: ServiceAccount
metadata:
  name: factory
  namespace: tap-factory
automountServiceAccountToken: false
---
# Conversations (pi-durable SQLite), job records and job checkouts. The
# factory resumes unfinished jobs from here after a restart.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: factory-data
  namespace: tap-factory
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 10Gi }
