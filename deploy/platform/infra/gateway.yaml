apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: tap
spec:
  logging:
    level:
      default: warn
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: LoadBalancer
        externalTrafficPolicy: Local
        annotations:
          metallb.universe.tf/loadBalancerIPs: 192.168.2.225
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: tap
spec:
  gatewayClassName: eg
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: tap
  listeners:
    # Platform UI/API; OIDC callback lands here.
    - name: tap
      hostname: tap.hiddenfield.dev
      port: 443
      protocol: HTTPS
      tls:
        certificateRefs: [{ name: tap-tls }]
      allowedRoutes:
        namespaces: { from: Same }
    # Pulled by node containerd; never behind OIDC.
    - name: registry
      hostname: registry.hiddenfield.dev
      port: 443
      protocol: HTTPS
      tls:
        certificateRefs: [{ name: tap-tls }]
      allowedRoutes:
        namespaces: { from: Same }
    # One HTTPRoute per agent namespace.
    - name: agents
      hostname: "*.a.hiddenfield.dev"
      port: 443
      protocol: HTTPS
      tls:
        certificateRefs: [{ name: tap-tls }]
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - { key: tap.hiddenfield.dev/agent, operator: Exists }
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces: { from: Same }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
spec:
  parentRefs:
    - { name: tap, sectionName: http }
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect: { scheme: https, statusCode: 301 }
