# tap-console: web view of running agents at tap.hiddenfield.dev (behind the
# Dex SecurityPolicy on the "tap" listener). Members of an agent's owning team
# (platform.yaml teams, from ConfigMap tap-platform) may set its display title
# (ConfigMap agent-settings), its secret values (OpenBao role tap-console), its
# hooks (settings in agent-settings, credentials in Secret agent-hooks, which
# the console may patch but not read) and propose agent.yaml egress changes
# (a PR, through the factory).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tap-console
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tap-console
rules:
  # Agents live in their own namespaces; the console only reads Deployments and Pods.
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [list, get]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list, get]
  # Which secrets an agent declares and their OpenBao paths; force-sync after
  # the console writes a value.
  - apiGroups: [external-secrets.io]
    resources: [externalsecrets]
    resourceNames: [tool-secrets]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tap-console
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tap-console
subjects:
  - kind: ServiceAccount
    name: tap-console
    namespace: tap-system
---
# Display titles and hook settings; hook credentials, write-only. Both are
# created empty by `task platform:up`.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tap-console
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [agent-settings]
    verbs: [get, update]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [agent-hooks]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tap-console
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tap-console
subjects:
  - kind: ServiceAccount
    name: tap-console
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tap-console
spec:
  replicas: 1
  selector:
    matchLabels: { app: tap-console }
  template:
    metadata:
      labels: { app: tap-console }
    spec:
      serviceAccountName: tap-console
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: console
          image: registry.hiddenfield.dev/tap/console@sha256:f46d3b5b06df6874cede32f3e66899795d832b64f20c0093c422ba738ff32095
          args:
            # Proxied at /api/factory/*; the factory admits only this pod.
            - --factory-url=http://factory.tap-factory.svc.cluster.local:8080
            # Teams and OpenBao settings; ConfigMap from `task console:config`.
            - --platform=/etc/tap/platform/platform.yaml
          env:
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: platform, mountPath: /etc/tap/platform, readOnly: true }
            - { name: openbao-token, mountPath: /var/run/secrets/openbao, readOnly: true }
      volumes:
        - name: platform
          configMap: { name: tap-platform }
        # Logs in to OpenBao as role tap-console: write-only on secret/tap/*.
        - name: openbao-token
          projected:
            sources:
              - serviceAccountToken: { path: token, audience: openbao, expirationSeconds: 3600 }
---
apiVersion: v1
kind: Service
metadata:
  name: tap-console
spec:
  selector: { app: tap-console }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tap-console
spec:
  parentRefs:
    - { name: tap, sectionName: tap }
  hostnames: [tap.hiddenfield.dev]
  rules:
    - backendRefs:
        - { name: tap-console, port: 80 }
