# What CI in ipedrazas/tap-agents may do in the cluster: run fixture Jobs in
# tap-ci and read their logs, as tap-ci-runner. CI has no long-lived
# credential: it logs in to OpenBao with GitHub's OIDC token, and OpenBao's
# Kubernetes secrets engine (tap-kubernetes/) mints a short-lived token for
# tap-ci-runner using openbao-ci-issuer, which may do nothing else.
# Apply with `task ci:onboard`.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tap-ci-runner
  namespace: tap-ci
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tap-ci-runner
  namespace: tap-ci
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, list, watch, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tap-ci-runner
  namespace: tap-ci
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: tap-ci-runner }
subjects:
  - { kind: ServiceAccount, name: tap-ci-runner, namespace: tap-ci }
---
# OpenBao's identity for minting tap-ci-runner tokens. Lives in tap-system so
# the onboarding pod can mount its token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-ci-issuer
  namespace: tap-system
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: openbao-ci-issuer-token
  namespace: tap-system
  annotations:
    kubernetes.io/service-account.name: openbao-ci-issuer
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openbao-ci-issuer
  namespace: tap-ci
rules:
  - apiGroups: [""]
    resources: [serviceaccounts/token]
    resourceNames: [tap-ci-runner]
    verbs: [create]
  - apiGroups: [""]
    resources: [serviceaccounts]
    resourceNames: [tap-ci-runner]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openbao-ci-issuer
  namespace: tap-ci
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: openbao-ci-issuer }
subjects:
  - { kind: ServiceAccount, name: openbao-ci-issuer, namespace: tap-system }
