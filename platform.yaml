# Platform configuration read by tapctl. Image digests are written by
# `task images:push`; agents may only use runners listed here (rule 6).
registry: registry.hiddenfield.dev
domain: a.hiddenfield.dev
namespacePrefix: agent-
runtimeClass: gvisor
gateway:
  name: tap
  namespace: tap-system
  listener: agents
  # Envoy pods serving Gateway/tap; agent pods accept ingress only from them.
  podNamespace: envoy-gateway-system
model:
  # Envoy AI Gateway in kodo-inference; routes are selected with x-ai-eg-model.
  baseURL: http://kodo-inference.envoy-gateway-system.svc.cluster.local/v1
  routes: [default, agent, sim]
  # API-key auth on the gateway; the key lives in tap-system/model-credentials
  # (`task model:client`) and is copied into each agent namespace.
  apiKeyHeader: x-kodo-gateway-key
  networkPolicy:
    namespace: envoy-gateway-system
    port: 10080
    podLabels:
      gateway.envoyproxy.io/owning-gateway-name: kodo-inference
      gateway.envoyproxy.io/owning-gateway-namespace: kodo-inference
egressProxy:
  address: egress-proxy.tap-system.svc.cluster.local:3128
# Tool i of an agent runs as uid/gid toolUIDBase+i, separate from the runner.
toolUIDBase: 61000
harness:
  image: registry.hiddenfield.dev/tap/harness@sha256:23db9036e86f120b8a2a91cfda119d7fc4c96a9b85d87b15ace142494c6f0281
  resources: {cpu: 250m, memory: 256Mi}
runners:
  - name: runner-node
    image: registry.hiddenfield.dev/tap/runner-node@sha256:2a2fbd7db2656a2ede86a47fc671ebd44f811c8baca80ae6c2772bb990cbb556
    interpreters: [node]
  - name: runner-python
    image: registry.hiddenfield.dev/tap/runner-python@sha256:108b881271cebe72017c81b90019c8644d58a84471e68f05b680cbec34edf7e0
    interpreters: [python3]
  - name: runner-base
    image: registry.hiddenfield.dev/tap/runner-base@sha256:3509790eb52de2ca365f5b9fc97ff9fb5089f964d1447b26705b40c72b0b7dda
    interpreters: [jq, curl]
# Supply chain (phase 7). Bundles and curated images are signed with the
# pipeline's cosign key (`task signing:key`; private half in .tap/cosign.key).
# Kyverno admits agent pods only if their bundle and images verify against
# publicKey and the bundle is also signed with testedPublicKey, which only
# `task agent:test` uses, after the fixtures pass (next to its attestation).
signing:
  publicKey: |
    -----BEGIN PUBLIC KEY-----
    MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEbF7LiNxfBzKgK9LcSAznwcT09yte
    Y7AQBY5s7sv5wA8KKdY1jWQVgn/fzrzGIotq7qJFNOOBzRrXvAWyDB0rdQ==
    -----END PUBLIC KEY-----
  # Signs bundles whose fixtures passed (private half in .tap/cosign-tested.key).
  testedPublicKey: |
    -----BEGIN PUBLIC KEY-----
    MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEvtYAsMRWjx5NnVa+5DWIijQA4ult
    NDgykMs2ok215azVKzJo6Ki8b1upsxLqLj8JfzGSZ6Tqwql6oQC8r9JLww==
    -----END PUBLIC KEY-----
  # in-toto predicate type of bundle attestations (`tapctl attest`).
  predicateType: https://tap.hiddenfield.dev/attestations/bundle/v1
  # audit: violations land in PolicyReports; enforce: pods are rejected.
  admission: audit
# Agent secrets (phase 8). External Secrets Operator syncs each declared
# secret from OpenBao into the agent's tool-secrets Secret. vault://<agent>/<key>
# is read from <kvMount>/<prefix>/<namespace>/<key>, field "value". OpenBao
# lets a namespace's tap-secrets account read only its own path.
secrets:
  server: https://openbao.alacasa.uk:8443
  kvMount: secret
  prefix: tap
  authMount: kubernetes-tap
  role: tap-agent
  audience: openbao
  # Platform secrets every agent reads (model-credentials, trigger-token,
  # sessions-credentials), pushed from tap-system by deploy/platform/infra/openbao-platform.yaml.
  sharedPrefix: tap-platform
  # Each agent's egress key, generated in its namespace and pushed to
  # <egressPrefix>/<namespace>; the egress proxy reads it from there.
  egressPrefix: tap-egress
# Session traces. Every harness writes each session as a casa trace document
# to a volume after every turn; a casa-collector sidecar uploads it to
# <bucket>/<agent>/<session_id>.trace.json through the egress proxy (scope
# collector:sessions). The write key is in tap-system/sessions-credentials
# (`task sessions:setup`) and is copied into each agent namespace, mounted
# into the collector only. Remove this block to turn export off.
sessions:
  endpoint: https://t3.storage.dev
  bucket: hiddenfield-tap-sessions
  region: auto
  # Placeholder until `task images:push IMAGES=casa-collector`; render refuses it.
  collectorImage: registry.hiddenfield.dev/tap/casa-collector@sha256:e5e3e2515993d3758186b573d57ba89883c2e86a9917e46ef58ca4d0855f8704
# Agent hooks. tap-hooks (deploy/platform/apps/hooks.yaml) receives deliveries at
# <publicURL>/h/<agent>/<hook> and starts a turn on the agent's trigger port.
# Owners add hooks in the console. Remove this block to turn hooks off.
hooks:
  publicURL: https://hooks.hiddenfield.dev
# Who may change an agent's settings in the console (display title, secret
# values, egress PRs): teams[metadata.owner] lists the Dex emails of its
# owners. Changes go live when they merge to main (Flux applies them).
teams:
  platform: [alice@hiddenfield.dev]
  teamb: [alice@hiddenfield.dev, bob@hiddenfield.dev]
