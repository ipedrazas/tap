# Platform configuration read by tapctl. Image digests are written by
# `task images:push`; agents may only use runners listed here (rule 6).
registry: registry.hiddenfield.dev
domain: a.hiddenfield.dev
namespacePrefix: agent-
runtimeClass: gvisor
gateway:
  name: tap
  namespace: tap-system
  listener: agents
  # Envoy pods serving Gateway/tap; agent pods accept ingress only from them.
  podNamespace: envoy-gateway-system
model:
  # Envoy AI Gateway in kodo-inference; routes are selected with x-ai-eg-model.
  baseURL: http://kodo-inference.envoy-gateway-system.svc.cluster.local/v1
  routes: [default, agent, sim]
  # API-key auth on the gateway; the key lives in tap-system/model-credentials
  # (`task model:client`) and is copied into each agent namespace.
  apiKeyHeader: x-kodo-gateway-key
  networkPolicy:
    namespace: envoy-gateway-system
    port: 10080
    podLabels:
      gateway.envoyproxy.io/owning-gateway-name: kodo-inference
      gateway.envoyproxy.io/owning-gateway-namespace: kodo-inference
egressProxy:
  address: egress-proxy.tap-system.svc.cluster.local:3128
  image: registry.hiddenfield.dev/tap/egress-proxy@sha256:a34f912a7cc8edfd47a29de74e797d70c6fe1a5739713ad0685509edf7315dac
# Tool i of an agent runs as uid/gid toolUIDBase+i, separate from the runner.
toolUIDBase: 61000
harness:
  image: registry.hiddenfield.dev/tap/harness@sha256:513d1b2f4e8b1a62938d8f72f873d53ecfc09abe42d40c7de5f143c3b2bd69e0
  resources: {cpu: 250m, memory: 256Mi}
runners:
  - name: runner-node
    image: registry.hiddenfield.dev/tap/runner-node@sha256:e37dc3d07c859b1249600a87c1bdabb4af8b3ad2c9e00c76437ea3c93f8d952a
    interpreters: [node]
  - name: runner-python
    image: registry.hiddenfield.dev/tap/runner-python@sha256:71bdcf7eab61af0d57a98291f7bbb27aba9d1c82b70a422a6347b6734c2ee283
    interpreters: [python3]
  - name: runner-base
    image: registry.hiddenfield.dev/tap/runner-base@sha256:9fb011990609b302b13a5de51a467e03010475e666546149656bfb0e149fb3fd
    interpreters: [jq, curl]
