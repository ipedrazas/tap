# A2 Configuration
# Generated by: a2 init
#
# Run checks with: a2 check
# List all checks: a2 list checks   ·   Explain one: a2 explain <id>

# Languages to check. Commented out = auto-detect from the repo.
language:
  explicit: [go]
  go:
    coverage_threshold: 50


# Files that must exist in the repository root.
files:
  required:
    - README.md
    - LICENSE


# How checks are executed.
execution:
  parallel: true      # run checks concurrently
  # concurrency: 0    # max checks at once (0 = number of CPUs)

# Disable individual checks by ID (see 'a2 list checks').
checks:
  disabled:
    - go:logging  # Skip logging check
    - go:cyclomatic
    - go:deadcode
    - go:deps_freshness
    - common:health  # Skip health check
    - common:api_docs  # Skip api docs check
    - common:integration  # Skip integration check
    - common:metrics  # Skip metrics check
    - common:errors  # Skip errors check
    - common:license  # Skip license check
    - common:tracing  # Skip tracing check
    - common:migrations  # Skip migrations check
    - common:e2e  # Skip e2e tests check
    - common:config_validation  # Skip config validation check
    - common:retry  # Skip retry check
    - common:dockerfile  # Skip dockerfile check
    - common:contributing
    - common:changelog
    - common:naming
    - security:filesystem
    - security:network

security:
  obfuscation:
    allow:
      - "agents/**"
      - "pkg/factory/publish.go"
  shell_injection:
    allow:
      - "cmd/tapctl/main.go"
      - "pkg/attest/attest.go"
      - "pkg/runner/runner.go"
